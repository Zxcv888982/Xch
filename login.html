<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>登录 · BlueFlow</title>
  <style>
    :root {
      --blue: #12b7f5;
      --blue-dark: #0d9ed9;
      --blue-light: #e8f7fd;
      --bg: #f5f7fa;
      --white: #ffffff;
      --text: #1a1a2e;
      --text-gray: #8e8e93;
      --border: #e8ecf1;
      --radius: 16px;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%; max-width: 380px;
      background: var(--white);
      border-radius: 24px;
      padding: 44px 28px 32px;
      box-shadow: var(--shadow);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-area {
      text-align: center; margin-bottom: 36px;
    }
    .logo-circle {
      width: 72px; height: 72px; margin: 0 auto 16px;
      background: linear-gradient(135deg, #12b7f5, #0d9ed9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 8px 24px rgba(18,183,245,0.25);
    }
    .logo-title {
      font-size: 1.5rem; font-weight: 700; color: var(--text);
      letter-spacing: -0.3px;
    }
    .logo-sub {
      font-size: 0.82rem; color: var(--text-gray); margin-top: 4px;
    }
    .input-wrap {
      margin-bottom: 18px;
      position: relative;
    }
    .input-wrap .icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 1.1rem; z-index: 1;
    }
    .input-wrap input {
      width: 100%; padding: 14px 14px 14px 42px;
      border: 1.5px solid var(--border);
      border-radius: 14px; font-size: 0.95rem;
      outline: none; background: var(--bg);
      transition: all 0.25s; color: var(--text);
    }
    .input-wrap input:focus {
      border-color: var(--blue);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(18,183,245,0.08);
    }
    .input-wrap input::placeholder { color: #b0b7c3; }
    .btn-login {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #12b7f5, #0d9ed9);
      color: #fff; margin-top: 8px;
      box-shadow: 0 4px 16px rgba(18,183,245,0.3);
      transition: all 0.25s; letter-spacing: 1px;
    }
    .btn-login:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(18,183,245,0.2);
    }
    .toggle-row {
      text-align: center; margin-top: 20px;
      font-size: 0.85rem; color: var(--text-gray);
    }
    .toggle-row span {
      color: var(--blue); font-weight: 600; cursor: pointer;
    }
    .error-msg {
      color: #ff3b30; font-size: 0.8rem; text-align: center;
      margin-top: 10px; display: none;
      background: #fff0f0; padding: 8px 12px; border-radius: 10px;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>

<div class="container">
  <div class="logo-area">
    <div class="logo-circle">💬</div>
    <div class="logo-title">BlueFlow</div>
    <div class="logo-sub">登录你的账号</div>
  </div>

  <div class="input-wrap">
    <span class="icon">👤</span>
    <input type="text" id="username" placeholder="用户名" autocomplete="username" maxlength="20">
  </div>
  <div class="input-wrap">
    <span class="icon">🔒</span>
    <input type="password" id="password" placeholder="密码" autocomplete="current-password">
  </div>
  <div class="input-wrap" id="nickWrap" style="display:none">
    <span class="icon">✏️</span>
    <input type="text" id="nickname" placeholder="给自己起个昵称" maxlength="15">
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <button class="btn-login" id="submitBtn">登 录</button>
  <div class="toggle-row">
    <span id="toggleLink">还没有账号？立即注册</span>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  let isLogin=true;
  if(localStorage.getItem('chat_token')){location.href='/';return}
  $('toggleLink').addEventListener('click',()=>{
    isLogin=!isLogin;
    $('submitBtn').textContent=isLogin?'登 录':'注 册';
    $('toggleLink').textContent=isLogin?'还没有账号？立即注册':'已有账号？去登录';
    $('nickWrap').style.display=isLogin?'none':'block';
    $('errorMsg').classList.remove('show');
  });
  async function submit(){
    const u=$('username').value.trim(),p=$('password').value.trim();
    $('errorMsg').classList.remove('show');
    if(!u||!p){$('errorMsg').textContent='请填写用户名和密码';$('errorMsg').classList.add('show');return}
    const url=isLogin?'/api/login':'/api/register';
    const body={username:u,password:p};
    if(!isLogin)body.nickname=$('nickname').value.trim()||u;
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json();
      if(d.success){
        if(isLogin){localStorage.setItem('chat_token',d.token);localStorage.setItem('chat_user',JSON.stringify(d.user));location.href='/'}
        else{$('errorMsg').textContent='✅ 注册成功！请登录';$('errorMsg').style.color='#34c759';$('errorMsg').style.background='#f0fff4';$('errorMsg').classList.add('show');setTimeout(()=>$('toggleLink').click(),1000)}
      }else{$('errorMsg').textContent=d.message||'操作失败';$('errorMsg').classList.add('show')}
    }catch(e){$('errorMsg').textContent='网络错误';$('errorMsg').classList.add('show')}
  }
  $('submitBtn').addEventListener('click',submit);
  $('password').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
})();
</script>
</body>
</html>
