<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>聊天室</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:#f0f2f5;height:100vh;height:100dvh;
      display:flex;flex-direction:column;overflow:hidden;
      -webkit-tap-highlight-color:transparent;
      user-select:none;-webkit-user-select:none;
    }
    body *{will-change:transform}
    /* 加载 */
    .loading-screen{
      display:flex;align-items:center;justify-content:center;
      height:100%;flex-direction:column;gap:16px;background:#f0f2f5;
    }
    .loading-screen .spinner{
      width:36px;height:36px;border:3px solid #e0e0e0;
      border-top-color:#1677ff;border-radius:50%;
      animation:spin 0.6s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-screen span{font-size:0.9rem;color:#999}
    /* 主界面 */
    .main-app{display:none;flex-direction:column;height:100%}
    .main-app.show{display:flex}
    /* 导航 */
    .navbar{
      background:#fff;padding:8px 12px;
      display:flex;align-items:center;gap:8px;
      border-bottom:0.5px solid #e8e8e8;flex-shrink:0;
      height:48px;
    }
    .navbar .title{font-size:1rem;font-weight:600;color:#1a1a1a;flex:1}
    .navbar .badge{font-size:0.7rem;color:#999;background:#f5f5f5;padding:3px 8px;border-radius:10px}
    .nav-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0}
    .nav-avatar-ph{width:30px;height:30px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:0.9rem;cursor:pointer;flex-shrink:0}
    .btn-logout{
      background:#ff4d4f;color:#fff;border:none;
      padding:4px 10px;border-radius:12px;font-size:0.7rem;
      cursor:pointer;white-space:nowrap;
    }
    /* 消息列表 */
    .msg-list{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:#f0f2f5;-webkit-overflow-scrolling:touch}
    .msg-list .empty{text-align:center;color:#b0b0b0;font-size:0.8rem;margin-top:40px}
    /* 消息行 */
    .msg{display:flex;align-items:flex-end;gap:6px;animation:msgIn 0.08s ease}
    .msg.self{flex-direction:row-reverse}
    .msg-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;cursor:pointer}
    .msg-avatar-ph{width:30px;height:30px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:0.8rem;flex-shrink:0;cursor:pointer}
    .msg-content{max-width:70%;display:flex;flex-direction:column}
    .msg-name{font-size:0.65rem;color:#999;margin-bottom:1px}
    .msg.self .msg-name{text-align:right}
    .msg-bubble{
      padding:7px 11px;border-radius:14px;font-size:0.88rem;line-height:1.4;
      word-break:break-word;background:#fff;color:#1a1a1a;
      box-shadow:0 0.5px 1px rgba(0,0,0,0.03);position:relative;cursor:pointer;
    }
    .msg.self .msg-bubble{background:#1677ff;color:#fff;border-bottom-right-radius:3px}
    .msg.other .msg-bubble{border-bottom-left-radius:3px}
    .msg-bubble .at{color:#ff8c00;font-weight:600}
    .msg.self .msg-bubble .at{color:#ffd666}
    .msg-bubble img{max-width:180px;max-height:260px;border-radius:6px;display:block;cursor:pointer;object-fit:cover}
    .msg-bubble video{max-width:180px;max-height:260px;border-radius:6px;display:block;background:#000}
    .msg-bubble audio{max-width:160px;height:30px;outline:none}
    .msg-bubble .loading-box{
      display:flex;align-items:center;justify-content:center;
      width:160px;height:90px;background:#f5f5f5;border-radius:6px;
      flex-direction:column;gap:4px;font-size:0.7rem;color:#999;
    }
    .loading-box .bar{width:60px;height:3px;background:#e0e0e0;border-radius:2px;overflow:hidden}
    .loading-box .bar i{display:block;height:100%;background:#1677ff;transition:width 0.2s}
    .msg-bubble .recalled{font-style:italic;opacity:0.5}
    .msg-time{font-size:0.55rem;color:#b0b0b0;margin-top:1px}
    .msg.self .msg-time{text-align:right}
    .msg-time .size{color:#b0b0b0}
    .msg.favorited .msg-bubble::after{content:'⭐';position:absolute;top:-6px;right:-2px;font-size:0.5rem}
    .system{text-align:center;font-size:0.65rem;color:#b0b0b0;padding:2px 0}
    @keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    /* 输入栏 */
    .input-bar{
      background:#fff;padding:6px 8px;display:flex;align-items:center;gap:5px;
      border-top:0.5px solid #e8e8e8;flex-shrink:0;height:48px;
      padding-bottom:max(6px,env(safe-area-inset-bottom));
    }
    .input-bar input{
      flex:1;border:none;background:#f5f5f5;border-radius:16px;
      padding:7px 12px;font-size:0.88rem;outline:none;color:#1a1a1a;
      height:34px;min-width:0;
    }
    .input-bar input::placeholder{color:#b0b0b0}
    .icon-btn{
      width:32px;height:32px;border-radius:50%;border:none;font-size:1rem;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;background:#f5f5f5;transition:transform 0.1s;
    }
    .icon-btn:active{transform:scale(0.9);background:#e8e8e8}
    .btn-send{
      background:#1677ff;color:#fff;width:auto;padding:0 14px;
      border-radius:16px;font-size:0.82rem;font-weight:600;height:32px;
    }
    .btn-send:active{background:#0958d9}
    .btn-mic.recording{background:#ff4d4f;color:#fff}
    /* 提示 */
    .record-tip{
      display:none;position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,0.8);color:#fff;padding:10px 20px;border-radius:10px;
      font-size:0.8rem;z-index:300;text-align:center;pointer-events:none;
    }
    .record-tip.show{display:block}
    .record-tip.cancel{background:rgba(255,77,79,0.9)}
    /* 菜单 */
    .menu{
      display:none;position:fixed;background:#fff;border-radius:10px;
      box-shadow:0 2px 16px rgba(0,0,0,0.12);z-index:400;padding:2px 0;min-width:110px;
    }
    .menu.show{display:block}
    .menu .item{padding:9px 14px;font-size:0.82rem;cursor:pointer;display:flex;align-items:center;gap:6px}
    .menu .item:active{background:#f5f5f5}
    .menu .item.danger{color:#ff4d4f}
    /* @ 面板 */
    .at-panel{
      display:none;position:absolute;bottom:50px;left:8px;right:8px;
      background:#fff;border-radius:10px;box-shadow:0 -1px 16px rgba(0,0,0,0.08);
      max-height:160px;overflow-y:auto;z-index:100;
    }
    .at-panel.show{display:block}
    .at-item{padding:9px 12px;cursor:pointer;font-size:0.85rem;display:flex;align-items:center;gap:6px}
    .at-item:active{background:#f5f5f5}
    /* 底部导航 */
    .bottom-nav{background:#fff;display:flex;border-top:0.5px solid #e8e8e8;flex-shrink:0;height:44px}
    .bottom-nav .nav-item{flex:1;text-align:center;padding:6px 0;font-size:0.6rem;color:#999;cursor:pointer}
    .bottom-nav .nav-item.active{color:#1677ff}
    .bottom-nav .nav-item span{font-size:1.1rem;display:block}
    /* 图片查看 */
    .viewer{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.96);z-index:500;justify-content:center;align-items:center}
    .viewer.show{display:flex}
    .viewer img,.viewer video{max-width:95%;max-height:85%;border-radius:6px}
    .viewer .close{position:absolute;top:14px;left:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;border:none;font-size:1rem;cursor:pointer}
    /* 模态 */
    .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;justify-content:center;align-items:center}
    .modal.show{display:flex}
    .modal-content{background:#fff;border-radius:14px;padding:16px;width:90%;max-width:300px;text-align:center}
    .modal-content h3{margin-bottom:10px;font-size:0.9rem}
    .emoji-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
    .emoji-item{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:#f5f5f5;cursor:pointer;border:2px solid transparent}
    .emoji-item.selected{border-color:#1677ff;background:#e6f0ff}
    .btn-xs{padding:6px 14px;border-radius:12px;border:none;font-size:0.8rem;cursor:pointer;margin:2px}
    .btn-xs-primary{background:#1677ff;color:#fff}
    .btn-xs-outline{background:#fff;color:#1677ff;border:1px solid #1677ff}
  </style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <span>加载中...</span>
</div>

<div class="main-app" id="mainApp">
  <div class="navbar">
    <div class="title">💬 聊天室</div>
    <div class="badge" id="onlineBadge">在线 0</div>
    <button class="btn-logout" id="btnLogout">退出</button>
    <img class="nav-avatar" id="myAvatarImg" src="" style="display:none">
    <div class="nav-avatar-ph" id="myAvatarPH">😀</div>
  </div>

  <div class="msg-list" id="messageList"><div class="empty">暂无消息</div></div>

  <div class="at-panel" id="atPanel"></div>

  <div class="menu" id="contextMenu">
    <div class="item" data-action="copy">📋 复制</div>
    <div class="item" data-action="favorite">⭐ 收藏</div>
    <div class="item danger" data-action="recall">🗑 撤回</div>
  </div>

  <div class="input-bar">
    <button class="icon-btn" id="btnImage">🖼</button>
    <button class="icon-btn" id="btnVideo">🎬</button>
    <button class="icon-btn btn-mic" id="btnMic">🎤</button>
    <input type="text" id="msgInput" placeholder="输入消息，@ 好友..." autocomplete="off">
    <button class="icon-btn btn-send" id="btnSend">发送</button>
  </div>
  <div class="record-tip" id="recordTip">手指上滑取消发送</div>

  <div class="bottom-nav">
    <div class="nav-item active" data-tab="chat"><span>💬</span>消息</div>
    <div class="nav-item" data-tab="favorites"><span>⭐</span>收藏</div>
  </div>
</div>

<div class="main-app" id="favoritesApp">
  <div class="navbar">
    <div class="title">⭐ 收藏</div>
    <button class="btn-logout" id="btnBackToChat" style="background:#1677ff">← 返回</button>
  </div>
  <div class="msg-list" id="favoritesList" style="flex:1"></div>
</div>

<div class="viewer" id="viewer">
  <button class="close" id="btnCloseViewer">✕</button>
  <img id="viewerImg" src="" style="display:none">
  <video id="viewerVideo" controls style="display:none"></video>
</div>

<div class="modal" id="avatarModal">
  <div class="modal-content">
    <h3>选择头像</h3>
    <div class="emoji-grid" id="emojiGrid"></div>
    <button class="btn-xs btn-xs-outline" id="btnPickPhoto">📷 从相册选择</button>
    <button class="btn-xs btn-xs-primary" id="btnCloseAvatar">完成</button>
  </div>
</div>

<input type="file" id="imageInput" accept="image/*" style="display:none">
<input type="file" id="videoInput" accept="video/*" style="display:none">
<input type="file" id="avatarInput" accept="image/*" style="display:none">

<script>
(function(){
  const $=id=>document.getElementById(id);
  let socket=null,clientId=null,user={username:null,nickname:'',avatar:'😀',avatarType:'emoji',signature:''};
  let online=[],favIds=[],received=new Set(),mediaRecorder=null,audioChunks=[],recording=false,startY=0;
  let menuMsgId=null,menuIsSelf=false,longPress=null,lastSend=0,tab='chat';

  const emojis=['😀','😎','🤖','👽','🐱','🦊','🐼','🐨','🦁','🐸','🐵','🦄','🐶','🐰','🦋','🌸'];

  // 初始化
  (async function init(){
    const token=localStorage.getItem('chat_token');
    if(!token){goLogin();return}
    try{
      const r=await fetch('/api/auto-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
      const d=await r.json();
      if(!d.success){goLogin();return}
      user={username:d.user.username,nickname:d.user.nickname,avatar:d.user.avatar,avatarType:d.user.avatarType||'emoji',signature:d.user.signature||''};
      localStorage.setItem('chat_user',JSON.stringify(user));
    }catch(e){goLogin();return}
    $('loadingScreen').style.display='none';
    $('mainApp').classList.add('show');
    updateAvatar();
    connect();
    loadHistory();
    loadFavIds();
    bindEvents();
  })();

  function goLogin(){localStorage.clear();window.location.href='/login.html'}
  function updateAvatar(){
    const i=$('myAvatarImg'),p=$('myAvatarPH');
    if(user.avatarType==='image'&&user.avatar){i.src=user.avatar;i.style.display='block';p.style.display='none'}
    else{p.textContent=user.avatar||'😀';i.style.display='none';p.style.display='flex'}
  }

  // WebSocket
  function connect(){
    if(socket){socket.onclose=null;socket.onmessage=null;socket.close()}
    socket=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}`);
    socket.onopen=()=>{if(user.username)socket.send(JSON.stringify({type:'login',username:user.username}))};
    socket.onmessage=e=>{try{onMsg(JSON.parse(e.data))}catch(ex){}};
    socket.onclose=()=>setTimeout(connect,1000);
  }

  function onMsg(d){
    switch(d.type){
      case'welcome':clientId=d.clientId;break;
      case'login_success':clientId=d.clientId||clientId;user.nickname=d.nickname;user.avatar=d.avatar;user.avatarType=d.avatarType||'emoji';user.signature=d.signature||'';updateAvatar();break;
      case'profile_updated':if(d.nickname)user.nickname=d.nickname;if(d.avatar)user.avatar=d.avatar;if(d.avatarType)user.avatarType=d.avatarType;if(d.signature!==undefined)user.signature=d.signature;updateAvatar();break;
      case'message':if(d.msgId&&received.has(d.msgId))return;if(d.msgId)received.add(d.msgId);addMsg(d,d.clientId===clientId);break;
      case'message-recalled':{const el=document.querySelector(`[data-mid="${d.msgId}"]`);if(el){const b=el.querySelector('.msg-bubble');b.textContent='[已撤回]';b.classList.add('recalled');b.querySelectorAll('img,video,audio,.loading-box').forEach(c=>c.remove())}}break;
      case'system':sysMsg(d.text);break;
      case'onlineUsers':online=d.users||[];$('onlineBadge').textContent=`在线 ${d.count}`;break;
    }
  }

  // 消息
  function addMsg(d,isSelf,container='messageList'){
    const row=document.createElement('div');row.className=`msg ${isSelf?'self':'other'}`;row.dataset.mid=d.msgId||'';
    if(favIds.includes(d.msgId))row.classList.add('favorited');
    // 头像
    const av=document.createElement('div');
    if(d.avatarType==='image'&&d.avatar)av.innerHTML=`<img class="msg-avatar" src="${d.avatar}">`;
    else av.innerHTML=`<div class="msg-avatar-ph">${d.avatar||'😀'}</div>`;
    av.addEventListener('click',()=>openProfile(d.senderUsername));
    // 内容
    const ct=document.createElement('div');ct.className='msg-content';
    const nm=document.createElement('div');nm.className='msg-name';nm.textContent=isSelf?'我':(d.sender||'匿名');
    ct.appendChild(nm);
    const bb=document.createElement('div');bb.className='msg-bubble';
    if(d.recalled){bb.textContent='[已撤回]';bb.classList.add('recalled')}
    else if(d.videoUrl)lazyMedia(bb,'video',d.videoUrl,d.fileSize);
    else if(d.imageUrl)lazyMedia(bb,'image',d.imageUrl,d.fileSize);
    else if(d.audioUrl){const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=d.audioUrl;bb.appendChild(a)}
    else bb.innerHTML=hiAt(d.text||'',d.mentions||[]);
    bb.addEventListener('touchstart',e=>{if(e.touches.length===1){clearLP();longPress=setTimeout(()=>showMenu(e,d,isSelf),400)}});
    bb.addEventListener('touchend',clearLP);bb.addEventListener('touchmove',clearLP);
    bb.addEventListener('contextmenu',e=>{e.preventDefault();showMenu(e,d,isSelf)});
    ct.appendChild(bb);
    const tm=document.createElement('div');tm.className='msg-time';
    const sz=d.fileSize?(d.fileSize>=1024?`<span class="size">${(d.fileSize/1024).toFixed(1)}MB</span>`:`<span class="size">${d.fileSize}KB</span>`):'';
    tm.innerHTML=`${d.timestamp?new Date(d.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''} ${sz}`;
    ct.appendChild(tm);
    if(isSelf){row.appendChild(ct);row.appendChild(av)}else{row.appendChild(av);row.appendChild(ct)}
    $(container).appendChild(row);
    if(container==='messageList')scrollBottom();
  }

  function lazyMedia(bb,type,src,size){
    const box=document.createElement('div');box.className='loading-box';
    box.innerHTML=`<span>${size?size+'KB':''}</span><div class="bar"><i style="width:0%"></i></div>`;
    bb.appendChild(box);
    const el=type==='image'?document.createElement('img'):document.createElement('video');
    if(type==='video'){el.controls=true;el.preload='metadata'}
    el.src=src;el.style.display='none';bb.appendChild(el);
    let p=0;const t=setInterval(()=>{p+=12;if(p>=95)clearInterval(t);box.querySelector('i').style.width=p+'%'},60);
    const done=()=>{clearInterval(t);box.remove();el.style.display='block';if(type==='image')el.addEventListener('click',()=>openViewer(src,null))};
    el.onloadedmetadata=done;el.oncanplay=done;el.onload=done;
    el.onerror=()=>{clearInterval(t);box.innerHTML='加载失败'};
  }

  function hiAt(t,m){let h=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');(m||[]).forEach(n=>{h=h.replace(new RegExp(`@${n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}`,'g'),`<span class="at">@${n}</span>`)});return h}
  function sysMsg(t){const d=document.createElement('div');d.className='system';d.textContent=t;$('messageList').appendChild(d);scrollBottom()}
  function scrollBottom(){const l=$('messageList');requestAnimationFrame(()=>{l.scrollTop=l.scrollHeight})}

  // 长按菜单
  function clearLP(){if(longPress){clearTimeout(longPress);longPress=null}}
  function showMenu(e,d,isSelf){
    const m=$('contextMenu');menuMsgId=d.msgId;menuIsSelf=isSelf;
    m.querySelector('[data-action="recall"]').style.display=isSelf&&!d.recalled&&(Date.now()-d.timestamp<120000)?'flex':'none';
    m.querySelector('[data-action="copy"]').style.display=d.text&&!d.recalled?'flex':'none';
    const x=(e.touches?e.touches[0].clientX:e.clientX)||100;
    const y=(e.touches?e.touches[0].clientY:e.clientY)||200;
    m.style.left=Math.min(x,innerWidth-120)+'px';m.style.top=Math.min(y,innerHeight-100)+'px';m.classList.add('show');
  }

  function copyMsg(){const el=document.querySelector(`[data-mid="${menuMsgId}"]`);if(el){const t=el.querySelector('.msg-bubble')?.textContent;if(t)navigator.clipboard?.writeText(t).then(()=>sysMsg('已复制')).catch(()=>{})}}
  function toggleFav(){fetch('/api/toggle-favorite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.username,msgId:menuMsgId})}).then(r=>r.json()).then(d=>{if(d.success){favIds=d.favIds;document.querySelectorAll(`[data-mid="${menuMsgId}"]`).forEach(e=>e.classList.toggle('favorited',d.isFavorited));sysMsg(d.isFavorited?'已收藏':'已取消')}})}
  function recallMsg(){if(!confirm('撤回？'))return;fetch('/api/recall-message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msgId:menuMsgId,username:user.username})}).then(r=>r.json()).then(d=>{if(!d.success)alert(d.message)})}
  function openViewer(img,video){const v=$('viewer');v.classList.add('show');if(video){$('viewerVideo').src=video;$('viewerVideo').style.display='block';$('viewerImg').style.display='none'}else{$('viewerImg').src=img;$('viewerImg').style.display='block';$('viewerVideo').style.display='none'}}

  // 历史
  function loadHistory(){
    fetch('/api/messages').then(r=>r.json()).then(d=>{
      $('messageList').innerHTML='';
      if(d.success&&d.messages?.length){
        const f=document.createDocumentFragment();
        d.messages.forEach(m=>{if(m.msgId)received.add(m.msgId);const s=(m.senderUsername&&m.senderUsername===user.username)||(m.clientId&&m.clientId===clientId);f.appendChild(createRow(m,s))});
        $('messageList').appendChild(f);
      }else $('messageList').innerHTML='<div class="empty">暂无消息</div>';
      scrollBottom();
    });
  }

  function createRow(d,isSelf){
    const row=document.createElement('div');row.className=`msg ${isSelf?'self':'other'}`;row.dataset.mid=d.msgId||'';if(favIds.includes(d.msgId))row.classList.add('favorited');
    const av=document.createElement('div');if(d.avatarType==='image'&&d.avatar)av.innerHTML=`<img class="msg-avatar" src="${d.avatar}">`;else av.innerHTML=`<div class="msg-avatar-ph">${d.avatar||'😀'}</div>`;av.addEventListener('click',()=>openProfile(d.senderUsername));
    const ct=document.createElement('div');ct.className='msg-content';
    const nm=document.createElement('div');nm.className='msg-name';nm.textContent=isSelf?'我':(d.sender||'匿名');ct.appendChild(nm);
    const bb=document.createElement('div');bb.className='msg-bubble';
    if(d.recalled){bb.textContent='[已撤回]';bb.classList.add('recalled')}
    else if(d.videoUrl)lazyMedia(bb,'video',d.videoUrl,d.fileSize);
    else if(d.imageUrl)lazyMedia(bb,'image',d.imageUrl,d.fileSize);
    else if(d.audioUrl){const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=d.audioUrl;bb.appendChild(a)}
    else bb.innerHTML=hiAt(d.text||'',d.mentions||[]);
    bb.addEventListener('touchstart',e=>{if(e.touches.length===1){clearLP();longPress=setTimeout(()=>showMenu(e,d,isSelf),400)}});
    bb.addEventListener('touchend',clearLP);bb.addEventListener('touchmove',clearLP);
    const tm=document.createElement('div');tm.className='msg-time';const sz=d.fileSize?(d.fileSize>=1024?`<span class="size">${(d.fileSize/1024).toFixed(1)}MB</span>`:`<span class="size">${d.fileSize}KB</span>`):'';tm.innerHTML=`${d.timestamp?new Date(d.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''} ${sz}`;
    ct.appendChild(bb);ct.appendChild(tm);
    if(isSelf){row.appendChild(ct);row.appendChild(av)}else{row.appendChild(av);row.appendChild(ct)}
    return row;
  }

  function loadFavorites(){
    fetch(`/api/favorites?username=${user.username}`).then(r=>r.json()).then(d=>{
      $('favoritesList').innerHTML='';
      if(d.success&&d.favorites?.length)d.favorites.forEach(m=>{const s=(m.senderUsername&&m.senderUsername===user.username);$('favoritesList').appendChild(createRow(m,s))});
      else $('favoritesList').innerHTML='<div class="empty">暂无收藏</div>';
    });
  }
  function loadFavIds(){fetch(`/api/favorites?username=${user.username}`).then(r=>r.json()).then(d=>{if(d.success)favIds=d.favIds||[]})}

  // 发送（防抖300ms）
  function sendText(){
    const now=Date.now();if(now-lastSend<300)return;lastSend=now;
    const t=$('msgInput').value.trim();if(!t||socket?.readyState!==WebSocket.OPEN)return;
    const mentions=[...t.matchAll(/@([\u4e00-\u9fa5\w]+)/g)].map(m=>m[1]).filter((v,i,a)=>a.indexOf(v)===i);
    socket.send(JSON.stringify({type:'message',text:t,mentions}));
    $('msgInput').value='';$('msgInput').focus();
  }

  function handleImage(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onloadend=()=>{
      const id='L'+Date.now();
      addMsg({msgId:id,imageUrl:r.result,sender:user.nickname,senderUsername:user.username,avatar:user.avatar,avatarType:user.avatarType,timestamp:Date.now(),fileSize:Math.round(f.size/1024)},true);
      scrollBottom();
      socket?.send(JSON.stringify({type:'image',image:r.result.split(',')[1],msgId:id}));
    };r.readAsDataURL(f);$('imageInput').value='';
  }

  function handleVideo(e){
    const f=e.target.files[0];if(!f||f.size>50*1024*1024){alert('≤50MB');return}
    const r=new FileReader();r.onloadend=()=>{
      const id='L'+Date.now();
      addMsg({msgId:id,videoUrl:r.result,sender:user.nickname,senderUsername:user.username,avatar:user.avatar,avatarType:user.avatarType,timestamp:Date.now(),fileSize:Math.round(f.size/(1024*1024)*10)/10},true);
      scrollBottom();
      socket?.send(JSON.stringify({type:'video',video:r.result,msgId:id}));
    };r.readAsDataURL(f);$('videoInput').value='';
  }

  async function startRec(){
    if(mediaRecorder?.state==='recording')return;
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(s);audioChunks=[];
      mediaRecorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};
      mediaRecorder.onstop=()=>{if(!audioChunks.length)return;const b=new Blob(audioChunks,{type:'audio/webm'});const r=new FileReader();r.onloadend=()=>{socket?.send(JSON.stringify({type:'audio',audio:r.result.split(',')[1]}))};r.readAsDataURL(b);s.getTracks().forEach(t=>t.stop())};
      mediaRecorder.start();recording=true;$('btnMic').classList.add('recording');$('recordTip').classList.add('show');
    }catch(e){alert('需要麦克风权限')}
  }
  function stopRec(){if(mediaRecorder&&recording&&mediaRecorder.state==='recording')mediaRecorder.stop();recording=false;$('btnMic').classList.remove('recording');$('recordTip').classList.remove('show','cancel')}
  function cancelRec(){if(mediaRecorder&&recording&&mediaRecorder.state==='recording'){audioChunks=[];mediaRecorder.onstop=()=>{};mediaRecorder.stop()}recording=false;$('btnMic').classList.remove('recording');$('recordTip').classList.remove('show','cancel')}

  // @
  function showAt(users){
    const p=$('atPanel');p.innerHTML='';
    users.slice(0,6).forEach(u=>{const d=document.createElement('div');d.className='at-item';d.textContent=u.nickname;d.addEventListener('click',()=>{const inp=$('msgInput'),v=inp.value,pos=inp.selectionStart,at=v.lastIndexOf('@',pos);inp.value=v.substring(0,at)+'@'+u.nickname+' '+v.substring(pos);inp.focus();inp.setSelectionRange(at+u.nickname.length+2,at+u.nickname.length+2);p.classList.remove('show')});p.appendChild(d)});
    p.classList.add('show');
  }

  // 用户主页
  function openProfile(un){
    if(!un||un===user.username)return;
    fetch(`/api/user-profile?username=${un}`).then(r=>r.json()).then(d=>{
      if(!d.success)return;
      alert(`${d.profile.nickname}\n@${d.profile.username}\n${d.profile.signature||''}\n${d.profile.isOnline?'在线':'离线'}`);
    });
  }

  function switchTab(t){
    tab=t;
    $('mainApp').style.display=t==='chat'?'flex':'none';
    $('favoritesApp').style.display=t==='favorites'?'flex':'none';
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.tab===t));
    if(t==='favorites')loadFavorites();
  }

  function bindEvents(){
    $('btnLogout').addEventListener('click',()=>{if(confirm('退出登录？'))goLogin()});
    $('btnBackToChat').addEventListener('click',()=>switchTab('chat'));
    $('btnSend').addEventListener('click',sendText);
    $('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});
    $('msgInput').addEventListener('input',()=>{
      const v=$('msgInput').value,p=$('msgInput').selectionStart;
      const m=v.substring(0,p).match(/@([\u4e00-\u9fa5\w]*)$/);
      if(m){const q=m[1].toLowerCase();const f=online.filter(u=>u.username!==user.username&&(u.nickname.toLowerCase().includes(q)||u.username.toLowerCase().includes(q)));if(f.length)showAt(f);else $('atPanel').classList.remove('show')}
      else $('atPanel').classList.remove('show');
    });
    $('btnImage').addEventListener('click',()=>$('imageInput').click());
    $('imageInput').addEventListener('change',handleImage);
    $('btnVideo').addEventListener('click',()=>$('videoInput').click());
    $('videoInput').addEventListener('change',handleVideo);
    $('btnCloseViewer').addEventListener('click',()=>$('viewer').classList.remove('show'));
    document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchTab(n.dataset.tab)));
    document.addEventListener('click',()=>$('contextMenu').classList.remove('show'));
    $('contextMenu').addEventListener('click',e=>{
      e.stopPropagation();
      const a=e.target.closest('.item')?.dataset.action;
      if(!a||!menuMsgId)return;
      if(a==='copy')copyMsg();else if(a==='favorite')toggleFav();else if(a==='recall')recallMsg();
      $('contextMenu').classList.remove('show');
    });
    const mic=$('btnMic'),tip=$('recordTip');
    mic.addEventListener('touchstart',e=>{e.preventDefault();startY=e.touches[0].clientY;startRec()});
    mic.addEventListener('touchmove',e=>{if(!recording)return;if(startY-e.touches[0].clientY>60){tip.classList.add('cancel');tip.textContent='松开发送'}else{tip.classList.remove('cancel');tip.textContent='手指上滑取消'}});
    mic.addEventListener('touchend',e=>{if(!recording)return;tip.classList.remove('show','cancel');if(startY-(e.changedTouches[0]?.clientY||startY)>60)cancelRec();else stopRec()});
    mic.addEventListener('mousedown',e=>{startY=e.clientY;startRec()});
    window.addEventListener('mouseup',()=>{if(recording){tip.classList.remove('show','cancel');stopRec()}});
    $('myAvatarPH').addEventListener('click',openAvatar);
    $('myAvatarImg').addEventListener('click',openAvatar);
    $('btnCloseAvatar').addEventListener('click',()=>$('avatarModal').classList.remove('show'));
    $('btnPickPhoto').addEventListener('click',()=>$('avatarInput').click());
    $('avatarInput').addEventListener('change',handleAvatarPick);
  }

  function openAvatar(){renderEmojis();$('avatarModal').classList.add('show')}
  function renderEmojis(){
    const g=$('emojiGrid');g.innerHTML='';
    emojis.forEach(e=>{const d=document.createElement('div');d.className='emoji-item';d.textContent=e;if(user.avatarType==='emoji'&&user.avatar===e)d.classList.add('selected');d.addEventListener('click',()=>{user.avatar=e;user.avatarType='emoji';updateAvatar();saveProfile();renderEmojis()});g.appendChild(d)});
  }
  function saveProfile(){
    fetch('/api/update-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.username,avatar:user.avatar,avatarType:user.avatarType})}).catch(()=>{});
    socket?.send(JSON.stringify({type:'update-profile',avatar:user.avatar,avatarType:user.avatarType}));
  }
  function handleAvatarPick(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{
      const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>h){if(w>200){h*=200/w;w=200}}else{if(h>200){w*=200/h;h=200}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);user.avatar=c.toDataURL('image/jpeg',0.7);user.avatarType='image';updateAvatar();saveProfile();renderEmojis()};img.src=ev.target.result;
    };r.readAsDataURL(f);$('avatarInput').value='';
  }
})();
</script>
</body>
</html>
