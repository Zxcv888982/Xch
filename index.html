<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>聊天室</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:#f0f2f5;height:100vh;height:100dvh;
      display:flex;flex-direction:column;overflow:hidden;
      -webkit-tap-highlight-color:transparent;
    }
    /* 加载中 */
    .loading-screen{
      display:flex;align-items:center;justify-content:center;
      height:100%;flex-direction:column;gap:16px;
      background:#f0f2f5;font-size:1rem;color:#999;
    }
    .loading-screen .spinner{
      width:40px;height:40px;border:3px solid #e0e0e0;
      border-top-color:#1677ff;border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    /* 主界面 */
    .main-app{display:none;flex-direction:column;height:100%}
    .main-app.show{display:flex}
    /* 导航 */
    .navbar{
      background:#fff;padding:10px 14px;
      display:flex;align-items:center;gap:10px;
      border-bottom:1px solid #e8e8e8;flex-shrink:0;
    }
    .navbar .title{font-size:1rem;font-weight:600;color:#1a1a1a;flex:1}
    .navbar .online-badge{font-size:0.7rem;color:#999;background:#f5f5f5;padding:3px 8px;border-radius:10px}
    .nav-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0}
    .nav-avatar-placeholder{width:32px;height:32px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;flex-shrink:0}
    /* 消息区 */
    .msg-list{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;background:#f0f2f5;-webkit-overflow-scrolling:touch}
    .msg-row{display:flex;flex-direction:column;max-width:80%;animation:fadeIn 0.15s ease}
    .msg-row.self{align-self:flex-end;align-items:flex-end}
    .msg-row.other{align-self:flex-start;align-items:flex-start}
    .msg-row.favorited::before{content:'⭐';position:absolute;top:-4px;right:-2px;font-size:0.5rem}
    .msg-header{display:flex;align-items:center;gap:6px;margin-bottom:2px;cursor:pointer}
    .msg-row.self .msg-header{flex-direction:row-reverse}
    .msg-name{font-size:0.7rem;color:#999}
    .msg-h-avatar{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .msg-h-avatar-placeholder{width:20px;height:20px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:0.6rem;flex-shrink:0}
    .msg-bubble{
      padding:9px 13px;border-radius:16px;font-size:0.9rem;line-height:1.45;
      word-break:break-word;background:#fff;color:#1a1a1a;
      box-shadow:0 1px 2px rgba(0,0,0,0.04);display:inline-block;max-width:100%;cursor:pointer;
      position:relative;
    }
    .msg-row.self .msg-bubble{background:#1677ff;color:#fff;border-bottom-right-radius:4px}
    .msg-row.other .msg-bubble{border-bottom-left-radius:4px}
    .msg-bubble .mention{color:#ff8c00;font-weight:600}
    .msg-row.self .msg-bubble .mention{color:#ffd666}
    .msg-bubble img{max-width:200px;max-height:280px;border-radius:8px;display:block;cursor:pointer;object-fit:cover}
    .msg-bubble video{max-width:200px;max-height:280px;border-radius:8px;display:block;background:#000}
    .msg-bubble audio{max-width:180px;height:32px}
    .msg-bubble .media-loading{
      display:flex;align-items:center;justify-content:center;
      width:180px;height:100px;background:#f5f5f5;border-radius:8px;
      font-size:0.75rem;color:#999;flex-direction:column;gap:6px;
    }
    .media-loading .progress-bar{width:80px;height:4px;background:#e0e0e0;border-radius:2px;overflow:hidden}
    .media-loading .progress-bar div{height:100%;background:#1677ff;transition:width 0.3s}
    .msg-recalled{font-style:italic;opacity:0.5}
    .msg-time{font-size:0.6rem;color:#b0b0b0;margin-top:2px;display:flex;align-items:center;gap:4px}
    .msg-row.self .msg-time{justify-content:flex-end}
    .msg-size{color:#b0b0b0}
    .system-msg{text-align:center;font-size:0.7rem;color:#b0b0b0;padding:4px;align-self:center}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    /* 输入栏 */
    .input-bar{
      background:#fff;padding:8px 10px;display:flex;align-items:center;gap:6px;
      border-top:1px solid #e8e8e8;flex-shrink:0;
      padding-bottom:max(8px,env(safe-area-inset-bottom));
    }
    .input-bar input{
      flex:1;border:none;background:#f5f5f5;border-radius:20px;
      padding:9px 14px;font-size:0.9rem;outline:none;color:#1a1a1a;min-width:0;
    }
    .input-bar input::placeholder{color:#b0b0b0}
    .icon-btn{
      width:34px;height:34px;border-radius:50%;border:none;font-size:1.1rem;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;background:#f5f5f5;
    }
    .icon-btn:active{background:#e8e8e8}
    .btn-send{background:#1677ff;color:#fff;width:auto;padding:0 16px;border-radius:18px;font-size:0.85rem;font-weight:600}
    .btn-send:active{background:#0958d9}
    .btn-mic.recording{background:#ff4d4f;color:#fff}
    /* 录音提示 */
    .record-tip{
      display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:12px;
      font-size:0.85rem;z-index:300;text-align:center;
    }
    .record-tip.show{display:block}
    .record-tip.cancel{background:rgba(255,77,79,0.9)}
    /* 长按菜单 */
    .context-menu{
      display:none;position:fixed;background:#fff;border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:400;padding:4px 0;min-width:120px;
    }
    .context-menu.show{display:block}
    .context-menu .item{padding:10px 16px;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:8px}
    .context-menu .item:active{background:#f5f5f5}
    .context-menu .item.danger{color:#ff4d4f}
    /* @ 面板 */
    .mention-panel{
      display:none;position:absolute;bottom:55px;left:10px;right:10px;
      background:#fff;border-radius:12px;box-shadow:0 -2px 20px rgba(0,0,0,0.1);
      max-height:180px;overflow-y:auto;z-index:100;
    }
    .mention-panel.show{display:block}
    .mention-item{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:0.9rem}
    .mention-item:active{background:#f5f5f5}
    /* 页面切换 */
    .page{display:none;flex-direction:column;height:100%}
    .page.active{display:flex}
    /* 用户主页 */
    .profile-page{background:#f0f2f5}
    .profile-header{
      background:linear-gradient(135deg,#4a6cf7,#6b3ff5);
      padding:24px 16px 20px;text-align:center;color:#fff;
    }
    .profile-header .p-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.5);margin-bottom:8px}
    .profile-header .p-avatar-placeholder{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.3);display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:8px}
    .profile-header .p-name{font-size:1.2rem;font-weight:600}
    .profile-header .p-sign{font-size:0.8rem;opacity:0.85;margin-top:2px}
    .profile-section{background:#fff;margin:10px 12px;border-radius:14px;padding:14px}
    .profile-section h4{font-size:0.85rem;color:#333;margin-bottom:8px}
    .intimacy-row{display:flex;flex-wrap:wrap;gap:8px}
    .intimacy-item{text-align:center;width:58px;cursor:pointer}
    .intimacy-item .i-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;margin:0 auto}
    .intimacy-item .i-avatar-placeholder{width:36px;height:36px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:1rem;margin:0 auto}
    .intimacy-item .i-name{font-size:0.6rem;color:#666;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .intimacy-item .i-count{font-size:0.55rem;color:#ff8c00}
    /* 底部导航 */
    .bottom-nav{background:#fff;display:flex;border-top:1px solid #e8e8e8;flex-shrink:0}
    .bottom-nav .nav-item{flex:1;text-align:center;padding:8px 0;font-size:0.65rem;color:#999;cursor:pointer;transition:color 0.2s}
    .bottom-nav .nav-item.active{color:#1677ff}
    .bottom-nav .nav-item span{font-size:1.2rem;display:block;margin-bottom:1px}
    /* 模态 */
    .modal{
      display:none;position:fixed;top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,0.5);z-index:200;justify-content:center;align-items:center;
    }
    .modal.show{display:flex}
    .modal-content{background:#fff;border-radius:16px;padding:18px;width:90%;max-width:320px;text-align:center}
    .modal-content h3{margin-bottom:12px;font-size:0.95rem}
    .emoji-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
    .emoji-item{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:#f5f5f5;cursor:pointer;border:2px solid transparent}
    .emoji-item.selected{border-color:#1677ff;background:#e6f0ff}
    .btn-sm{padding:8px 16px;border-radius:14px;border:none;font-size:0.85rem;cursor:pointer;margin:2px}
    .btn-sm-primary{background:#1677ff;color:#fff}
    .btn-sm-outline{background:#fff;color:#1677ff;border:1px solid #1677ff}
    /* 图片查看器 */
    .image-viewer{
      display:none;position:fixed;top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,0.95);z-index:500;justify-content:center;align-items:center;
    }
    .image-viewer.show{display:flex}
    .image-viewer img,.image-viewer video{max-width:95%;max-height:85%;border-radius:8px}
    .image-viewer .close{position:absolute;top:16px;left:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.2);color:#fff;border:none;font-size:1.2rem;cursor:pointer}
  </style>
</head>
<body>

<!-- 加载中 -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <div>加载中...</div>
</div>

<!-- 主应用 -->
<div class="main-app" id="mainApp">
  <!-- 导航 -->
  <div class="navbar" id="mainNavbar">
    <div class="title">💬 聊天室</div>
    <div class="online-badge" id="onlineBadge">在线 0</div>
    <img class="nav-avatar" id="myAvatarImg" src="" style="display:none">
    <div class="nav-avatar-placeholder" id="myAvatarPH">😀</div>
  </div>

  <!-- 消息列表 -->
  <div class="msg-list" id="messageList"></div>

  <!-- @ 面板 -->
  <div class="mention-panel" id="mentionPanel"></div>

  <!-- 长按菜单 -->
  <div class="context-menu" id="contextMenu">
    <div class="item" data-action="copy">📋 复制</div>
    <div class="item" data-action="favorite">⭐ 收藏</div>
    <div class="item danger" data-action="recall">🗑 撤回</div>
  </div>

  <!-- 输入栏 -->
  <div class="input-bar">
    <button class="icon-btn" id="btnImage">🖼</button>
    <button class="icon-btn" id="btnVideo">🎬</button>
    <button class="icon-btn btn-mic" id="btnMic">🎤</button>
    <input type="text" id="msgInput" placeholder="输入消息，@ 好友..." autocomplete="off">
    <button class="icon-btn btn-send" id="btnSend">发送</button>
  </div>

  <!-- 录音提示 -->
  <div class="record-tip" id="recordTip">手指上滑取消发送</div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="nav-item active" data-tab="chat"><span>💬</span>消息</div>
    <div class="nav-item" data-tab="favorites"><span>⭐</span>收藏</div>
  </div>
</div>

<!-- 收藏页 -->
<div class="main-app" id="favoritesApp">
  <div class="navbar">
    <div class="title">⭐ 收藏</div>
    <button class="icon-btn" id="btnBackToChat" style="width:auto;padding:0 12px;border-radius:14px;font-size:0.85rem">← 返回</button>
  </div>
  <div class="msg-list" id="favoritesList" style="flex:1"></div>
</div>

<!-- 用户主页 -->
<div class="main-app" id="profileApp">
  <div class="navbar" style="background:transparent;border:none;position:absolute;top:0;left:0;right:0;z-index:10">
    <button class="icon-btn" id="btnBackFromProfile" style="background:rgba(255,255,255,0.3);color:#fff;width:auto;padding:0 12px;border-radius:14px;font-size:0.85rem">← 返回</button>
  </div>
  <div class="profile-header" id="profileHeader"></div>
  <div style="flex:1;overflow-y:auto">
    <div class="profile-section">
      <h4>💬 最近发言</h4>
      <div id="recentMsgs"></div>
    </div>
    <div class="profile-section">
      <h4>💕 亲密关系</h4>
      <div class="intimacy-row" id="intimacyRow"></div>
    </div>
  </div>
</div>

<!-- 图片查看器 -->
<div class="image-viewer" id="imageViewer">
  <button class="close" id="btnCloseViewer">✕</button>
  <img id="viewerImg" src="" style="display:none">
  <video id="viewerVideo" controls style="display:none"></video>
</div>

<!-- 头像弹窗 -->
<div class="modal" id="avatarModal">
  <div class="modal-content">
    <h3>选择头像</h3>
    <div class="emoji-grid" id="emojiGrid"></div>
    <button class="btn-sm btn-sm-outline" id="btnPickPhoto">📷 从相册选择</button>
    <button class="btn-sm btn-sm-primary" id="btnCloseAvatar">完成</button>
  </div>
</div>

<input type="file" id="imageInput" accept="image/*" style="display:none">
<input type="file" id="videoInput" accept="video/*" style="display:none">
<input type="file" id="avatarInput" accept="image/*" style="display:none">

<script>
(function(){
  const $=id=>document.getElementById(id);
  let socket=null,clientId=null;
  let currentUser={username:null,nickname:'',avatar:'😀',avatarType:'emoji',signature:''};
  let onlineUsers=[],favIds=[],receivedMsgIds=new Set();
  let mediaRecorder=null,audioChunks=[],isRecording=false,startY=0;
  let contextMsgId=null,contextIsSelf=false,longPressTimer=null;
  let currentPage='chat';

  const emojis=['😀','😎','🤖','👽','🐱','🦊','🐼','🐨','🦁','🐸','🐵','🦄','🐶','🐰','🦋','🌸'];

  // ==================== 初始化 ====================
  async function init(){
    const token=localStorage.getItem('chat_token');
    if(!token){ window.location.href='/login.html'; return; }

    try{
      const res=await fetch('/api/auto-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
      const data=await res.json();
      if(!data.success){ localStorage.clear(); window.location.href='/login.html'; return; }
      currentUser={username:data.user.username,nickname:data.user.nickname,avatar:data.user.avatar,avatarType:data.user.avatarType||'emoji',signature:data.user.signature||''};
      localStorage.setItem('chat_user',JSON.stringify(currentUser));
    }catch(e){ window.location.href='/login.html'; return; }

    $('loadingScreen').style.display='none';
    $('mainApp').classList.add('show');
    updateMyAvatar();
    connectWS();
    loadHistory();
    loadFavIds();
    bindEvents();
  }

  // ==================== UI ====================
  function updateMyAvatar(){
    const img=$('myAvatarImg'),ph=$('myAvatarPH');
    if(currentUser.avatarType==='image'&&currentUser.avatar){
      img.src=currentUser.avatar;img.style.display='block';ph.style.display='none';
    }else{
      ph.textContent=currentUser.avatar||'😀';img.style.display='none';ph.style.display='flex';
    }
  }

  function showPage(p){
    currentPage=p;
    $('mainApp').style.display=p==='chat'?'flex':'none';
    $('favoritesApp').style.display=p==='favorites'?'flex':'none';
    $('profileApp').style.display=p==='profile'?'flex':'none';
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.tab===p));
    if(p==='favorites')loadFavorites();
  }

  // ==================== WebSocket ====================
  function connectWS(){
    if(socket){socket.onclose=null;socket.onmessage=null;socket.close()}
    socket=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}`);
    socket.onopen=()=>{if(currentUser.username)socket.send(JSON.stringify({type:'login',username:currentUser.username}))};
    socket.onmessage=e=>{try{handleWS(JSON.parse(e.data))}catch(ex){}};
    socket.onclose=()=>setTimeout(connectWS,2000);
  }

  function handleWS(data){
    switch(data.type){
      case'welcome':clientId=data.clientId;break;
      case'login_success':clientId=data.clientId||clientId;currentUser.nickname=data.nickname;currentUser.avatar=data.avatar;currentUser.avatarType=data.avatarType||'emoji';currentUser.signature=data.signature||'';updateMyAvatar();break;
      case'profile_updated':currentUser.nickname=data.nickname||currentUser.nickname;currentUser.avatar=data.avatar||currentUser.avatar;currentUser.avatarType=data.avatarType||currentUser.avatarType;if(data.signature!==undefined)currentUser.signature=data.signature;updateMyAvatar();break;
      case'message':if(data.msgId&&receivedMsgIds.has(data.msgId))return;if(data.msgId)receivedMsgIds.add(data.msgId);addMsg(data,data.clientId===clientId);break;
      case'message-recalled':{const el=document.querySelector(`[data-id="${data.msgId}"]`);if(el){const b=el.querySelector('.msg-bubble');b.textContent='[已撤回]';b.classList.add('msg-recalled');b.querySelectorAll('img,video,audio,.media-loading').forEach(c=>c.remove())}}break;
      case'system':addSys(data.text);break;
      case'onlineUsers':onlineUsers=data.users||[];$('onlineBadge').textContent=`在线 ${data.count}`;break;
    }
  }

  // ==================== 消息 ====================
  function addMsg(data,isSelf,container='messageList'){
    const row=document.createElement('div');
    row.className=`msg-row ${isSelf?'self':'other'}`;row.dataset.id=data.msgId||'';
    if(favIds.includes(data.msgId))row.classList.add('favorited');
    // header
    const hdr=document.createElement('div');hdr.className='msg-header';
    hdr.addEventListener('click',()=>openProfile(data.senderUsername));
    const nm=document.createElement('span');nm.className='msg-name';nm.textContent=isSelf?'我':(data.sender||'匿名');
    const av=document.createElement('div');
    if(data.avatarType==='image'&&data.avatar)av.innerHTML=`<img class="msg-h-avatar" src="${data.avatar}">`;
    else av.innerHTML=`<div class="msg-h-avatar-placeholder">${data.avatar||'😀'}</div>`;
    if(isSelf){hdr.appendChild(av);hdr.appendChild(nm)}else{hdr.appendChild(nm);hdr.appendChild(av)}
    // bubble
    const bub=document.createElement('div');bub.className='msg-bubble';
    if(data.recalled){bub.textContent='[已撤回]';bub.classList.add('msg-recalled')}
    else if(data.videoUrl)createMedia(bub,'video',data.videoUrl,data.fileSize);
    else if(data.imageUrl)createMedia(bub,'image',data.imageUrl,data.fileSize);
    else if(data.audioUrl){const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=data.audioUrl;bub.appendChild(a)}
    else bub.innerHTML=highlightMentions(data.text||'',data.mentions||[]);
    bub.addEventListener('touchstart',e=>{if(e.touches.length===1)startLP(e,data,isSelf)});
    bub.addEventListener('touchend',clearLP);bub.addEventListener('touchmove',clearLP);
    bub.addEventListener('contextmenu',e=>{e.preventDefault();showMenu(e,data,isSelf)});
    // time
    const tm=document.createElement('div');tm.className='msg-time';
    tm.innerHTML=`${data.timestamp?new Date(data.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''}${data.fileSize?`<span class="msg-size">${data.fileSize>=1024?(data.fileSize/1024).toFixed(1)+'MB':data.fileSize+'KB'}</span>`:''}`;
    row.appendChild(hdr);row.appendChild(bub);row.appendChild(tm);
    $(container).appendChild(row);
    if(container==='messageList')scrollBottom();
  }

  function createMedia(bub,type,src,size){
    const load=document.createElement('div');load.className='media-loading';
    load.innerHTML=`<span>${size?size+'KB':''}</span><div class="progress-bar"><div style="width:0%"></div></div>`;
    bub.appendChild(load);
    const el=type==='image'?document.createElement('img'):document.createElement('video');
    if(type==='video'){el.controls=true;el.preload='metadata'}
    el.src=src;el.style.display='none';bub.appendChild(el);
    let p=0;const t=setInterval(()=>{p+=10;if(p>=90)clearInterval(t);load.querySelector('.progress-bar div').style.width=p+'%'},80);
    el.onloadedmetadata=()=>{clearInterval(t);load.querySelector('.progress-bar div').style.width='100%';setTimeout(()=>{load.remove();el.style.display='block';if(type==='image')el.addEventListener('click',()=>openViewer(src,null))},100)};
    el.onerror=()=>{clearInterval(t);load.innerHTML='加载失败'};
    el.oncanplay=()=>{clearInterval(t);load.remove();el.style.display='block'};
  }

  function highlightMentions(text,mentions){
    let h=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    (mentions||[]).forEach(m=>{h=h.replace(new RegExp(`@${m.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}`,'g'),`<span class="mention">@${m}</span>`)});
    return h;
  }

  function addSys(text){const d=document.createElement('div');d.className='system-msg';d.textContent=text;$('messageList').appendChild(d);scrollBottom()}
  function scrollBottom(){const l=$('messageList');requestAnimationFrame(()=>{l.scrollTop=l.scrollHeight})}

  // ==================== 长按菜单 ====================
  function startLP(e,data,isSelf){clearLP();longPressTimer=setTimeout(()=>showMenu(e,data,isSelf),500)}
  function clearLP(){if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}}
  function showMenu(e,data,isSelf){
    const m=$('contextMenu');contextMsgId=data.msgId;contextIsSelf=isSelf;
    m.querySelector('[data-action="recall"]').style.display=isSelf&&!data.recalled&&(Date.now()-data.timestamp<120000)?'flex':'none';
    m.querySelector('[data-action="copy"]').style.display=data.text&&!data.recalled?'flex':'none';
    const x=(e.touches?e.touches[0].clientX:e.clientX)||100;
    const y=(e.touches?e.touches[0].clientY:e.clientY)||200;
    m.style.left=Math.min(x,innerWidth-130)+'px';m.style.top=Math.min(y,innerHeight-110)+'px';m.classList.add('show');
  }

  // ==================== 功能 ====================
  function copyMsg(id){const el=document.querySelector(`[data-id="${id}"]`);if(el){const t=el.querySelector('.msg-bubble')?.textContent;if(t)navigator.clipboard?.writeText(t).then(()=>addSys('已复制')).catch(()=>{})}}
  function toggleFav(id){fetch('/api/toggle-favorite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,msgId:id})}).then(r=>r.json()).then(d=>{if(d.success){favIds=d.favIds;document.querySelectorAll(`[data-id="${id}"]`).forEach(e=>e.classList.toggle('favorited',d.isFavorited));addSys(d.isFavorited?'已收藏':'已取消')}})}
  function recallMsg(id){if(!confirm('撤回？'))return;fetch('/api/recall-message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msgId:id,username:currentUser.username})}).then(r=>r.json()).then(d=>{if(!d.success)alert(d.message)})}
  function openViewer(img,video){const v=$('imageViewer');v.classList.add('show');if(video){$('viewerVideo').src=video;$('viewerVideo').style.display='block';$('viewerImg').style.display='none'}else{$('viewerImg').src=img;$('viewerImg').style.display='block';$('viewerVideo').style.display='none'}}

  // ==================== 用户主页 ====================
  function openProfile(username){
    if(!username||username===currentUser.username)return;
    fetch(`/api/user-profile?username=${username}`).then(r=>r.json()).then(d=>{
      if(!d.success)return;
      const p=d.profile;
      $('profileHeader').innerHTML=`
        ${p.avatarType==='image'?`<img class="p-avatar" src="${p.avatar}">`:`<div class="p-avatar-placeholder">${p.avatar||'😀'}</div>`}
        <div class="p-name">${p.nickname}${p.isOnline?' 🟢':''}</div>
        <div class="p-sign">${p.signature||'这个人很懒...'}</div>`;
      const rm=$('recentMsgs');rm.innerHTML='';
      if(d.recentMsgs?.length)d.recentMsgs.forEach(m=>{const div=document.createElement('div');div.style.cssText='padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:0.8rem;color:#666;display:flex;justify-content:space-between';div.innerHTML=`<span>${m.text||'[媒体]'}</span><span style="font-size:0.65rem;color:#999">${new Date(m.timestamp).toLocaleDateString()}</span>`;rm.appendChild(div)});
      else rm.innerHTML='<div style="color:#999;font-size:0.8rem">暂无发言</div>';
      const ir=$('intimacyRow');ir.innerHTML='';
      if(d.intimacyList?.length)d.intimacyList.forEach(i=>{const div=document.createElement('div');div.className='intimacy-item';div.innerHTML=`${i.avatarType==='image'?`<img class="i-avatar" src="${i.avatar}">`:`<div class="i-avatar-placeholder">${i.avatar||'😀'}</div>`}<div class="i-name">${i.nickname}</div><div class="i-count">💕${i.count}</div>`;div.addEventListener('click',()=>openProfile(i.username));ir.appendChild(div)});
      else ir.innerHTML='<div style="color:#999;font-size:0.8rem">暂无</div>';
      showPage('profile');
    });
  }

  // ==================== 加载历史 ====================
  function loadHistory(){
    fetch('/api/messages').then(r=>r.json()).then(d=>{
      $('messageList').innerHTML='';
      if(d.success&&d.messages?.length){
        const f=document.createDocumentFragment();
        d.messages.forEach(m=>{if(m.msgId)receivedMsgIds.add(m.msgId);const isSelf=(m.senderUsername&&m.senderUsername===currentUser.username)||(m.clientId&&m.clientId===clientId);f.appendChild(createRow(m,isSelf))});
        $('messageList').appendChild(f);
      }else $('messageList').innerHTML='<div class="system-msg">暂无消息</div>';
      scrollBottom();
    });
  }

  function createRow(data,isSelf){
    const row=document.createElement('div');row.className=`msg-row ${isSelf?'self':'other'}`;row.dataset.id=data.msgId||'';if(favIds.includes(data.msgId))row.classList.add('favorited');
    const hdr=document.createElement('div');hdr.className='msg-header';hdr.addEventListener('click',()=>openProfile(data.senderUsername));
    const nm=document.createElement('span');nm.className='msg-name';nm.textContent=isSelf?'我':(data.sender||'匿名');
    const av=document.createElement('div');if(data.avatarType==='image'&&data.avatar)av.innerHTML=`<img class="msg-h-avatar" src="${data.avatar}">`;else av.innerHTML=`<div class="msg-h-avatar-placeholder">${data.avatar||'😀'}</div>`;
    if(isSelf){hdr.appendChild(av);hdr.appendChild(nm)}else{hdr.appendChild(nm);hdr.appendChild(av)}
    const bub=document.createElement('div');bub.className='msg-bubble';
    if(data.recalled){bub.textContent='[已撤回]';bub.classList.add('msg-recalled')}
    else if(data.videoUrl)createMedia(bub,'video',data.videoUrl,data.fileSize);
    else if(data.imageUrl)createMedia(bub,'image',data.imageUrl,data.fileSize);
    else if(data.audioUrl){const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=data.audioUrl;bub.appendChild(a)}
    else bub.innerHTML=highlightMentions(data.text||'',data.mentions||[]);
    bub.addEventListener('touchstart',e=>{if(e.touches.length===1)startLP(e,data,isSelf)});
    bub.addEventListener('touchend',clearLP);bub.addEventListener('touchmove',clearLP);
    const tm=document.createElement('div');tm.className='msg-time';tm.innerHTML=`${data.timestamp?new Date(data.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''}${data.fileSize?`<span class="msg-size">${data.fileSize>=1024?(data.fileSize/1024).toFixed(1)+'MB':data.fileSize+'KB'}</span>`:''}`;
    row.appendChild(hdr);row.appendChild(bub);row.appendChild(tm);
    return row;
  }

  function loadFavorites(){
    fetch(`/api/favorites?username=${currentUser.username}`).then(r=>r.json()).then(d=>{
      $('favoritesList').innerHTML='';
      if(d.success&&d.favorites?.length)d.favorites.forEach(m=>{const isSelf=(m.senderUsername&&m.senderUsername===currentUser.username);$('favoritesList').appendChild(createRow(m,isSelf))});
      else $('favoritesList').innerHTML='<div class="system-msg">暂无收藏</div>';
    });
  }

  function loadFavIds(){fetch(`/api/favorites?username=${currentUser.username}`).then(r=>r.json()).then(d=>{if(d.success)favIds=d.favIds||[]})}

  // ==================== 发送 ====================
  function sendText(){
    const text=$('msgInput').value.trim();if(!text||socket?.readyState!==WebSocket.OPEN)return;
    const mentions=[...text.matchAll(/@([\u4e00-\u9fa5\w]+)/g)].map(m=>m[1]).filter((v,i,a)=>a.indexOf(v)===i);
    socket.send(JSON.stringify({type:'message',text,mentions}));
    $('msgInput').value='';$('msgInput').focus();
  }

  function handleImage(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();reader.onloadend=()=>{
      const id='local_'+Date.now();
      addMsg({msgId:id,imageUrl:reader.result,sender:currentUser.nickname,senderUsername:currentUser.username,avatar:currentUser.avatar,avatarType:currentUser.avatarType,timestamp:Date.now(),fileSize:Math.round(file.size/1024)},true);
      scrollBottom();
      const b64=reader.result.split(',')[1];
      if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'image',image:b64,msgId:id}));
    };reader.readAsDataURL(file);$('imageInput').value='';
  }

  function handleVideo(e){
    const file=e.target.files[0];if(!file||file.size>50*1024*1024)return alert('视频≤50MB');
    const reader=new FileReader();reader.onloadend=()=>{
      const id='local_'+Date.now();
      addMsg({msgId:id,videoUrl:reader.result,sender:currentUser.nickname,senderUsername:currentUser.username,avatar:currentUser.avatar,avatarType:currentUser.avatarType,timestamp:Date.now(),fileSize:Math.round(file.size/(1024*1024)*10)/10},true);
      scrollBottom();
      if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'video',video:reader.result,msgId:id}));
    };reader.readAsDataURL(file);$('videoInput').value='';
  }

  async function startRec(){
    if(mediaRecorder?.state==='recording')return;
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];
      mediaRecorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};
      mediaRecorder.onstop=()=>{if(!audioChunks.length)return;const blob=new Blob(audioChunks,{type:'audio/webm'});const reader=new FileReader();reader.onloadend=()=>{if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'audio',audio:reader.result.split(',')[1]}))};reader.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};
      mediaRecorder.start();isRecording=true;$('btnMic').classList.add('recording');$('recordTip').classList.add('show');
    }catch(e){alert('麦克风权限')}
  }
  function stopRec(){if(mediaRecorder&&isRecording&&mediaRecorder.state==='recording')mediaRecorder.stop();isRecording=false;$('btnMic').classList.remove('recording');$('recordTip').classList.remove('show','cancel')}
  function cancelRec(){if(mediaRecorder&&isRecording&&mediaRecorder.state==='recording'){audioChunks=[];mediaRecorder.onstop=()=>{};mediaRecorder.stop()}isRecording=false;$('btnMic').classList.remove('recording');$('recordTip').classList.remove('show','cancel')}

  // ==================== @ 功能 ====================
  $('msgInput').addEventListener('input',()=>{
    const val=$('msgInput').value,pos=$('msgInput').selectionStart;
    const match=val.substring(0,pos).match(/@([\u4e00-\u9fa5\w]*)$/);
    if(match){
      const q=match[1].toLowerCase();
      const filtered=onlineUsers.filter(u=>u.username!==currentUser.username&&(u.nickname.toLowerCase().includes(q)||u.username.toLowerCase().includes(q)));
      if(filtered.length){showMention(filtered);return}
    }
    $('mentionPanel').classList.remove('show');
  });
  function showMention(users){
    const p=$('mentionPanel');p.innerHTML='';
    users.slice(0,6).forEach(u=>{const d=document.createElement('div');d.className='mention-item';d.textContent=u.nickname;d.addEventListener('click',()=>{const inp=$('msgInput'),v=inp.value,pos=inp.selectionStart,at=v.lastIndexOf('@',pos);inp.value=v.substring(0,at)+'@'+u.nickname+' '+v.substring(pos);inp.focus();inp.setSelectionRange(at+u.nickname.length+2,at+u.nickname.length+2);p.classList.remove('show')});p.appendChild(d)});
    p.classList.add('show');
  }

  // ==================== 头像 ====================
  function openAvatar(){renderEmojis();$('avatarModal').classList.add('show')}
  function renderEmojis(){
    const g=$('emojiGrid');g.innerHTML='';
    emojis.forEach(e=>{const d=document.createElement('div');d.className='emoji-item';d.textContent=e;if(currentUser.avatarType==='emoji'&&currentUser.avatar===e)d.classList.add('selected');d.addEventListener('click',()=>{currentUser.avatar=e;currentUser.avatarType='emoji';updateMyAvatar();saveProfile();renderEmojis()});g.appendChild(d)});
  }
  function saveProfile(){
    if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'update-profile',nickname:currentUser.nickname,avatar:currentUser.avatar,avatarType:currentUser.avatarType,signature:currentUser.signature}));
    fetch('/api/update-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,avatar:currentUser.avatar,avatarType:currentUser.avatarType,signature:currentUser.signature})}).catch(()=>{});
  }
  function handleAvatarPick(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();reader.onload=ev=>{
      const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>h){if(w>200){h*=200/w;w=200}}else{if(h>200){w*=200/h;h=200}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);currentUser.avatar=c.toDataURL('image/jpeg',0.7);currentUser.avatarType='image';updateMyAvatar();saveProfile();renderEmojis()};img.src=ev.target.result;
    };reader.readAsDataURL(file);$('avatarInput').value='';
  }

  // ==================== 事件绑定 ====================
  function bindEvents(){
    $('btnSend').addEventListener('click',sendText);
    $('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});
    $('btnImage').addEventListener('click',()=>$('imageInput').click());
    $('imageInput').addEventListener('change',handleImage);
    $('btnVideo').addEventListener('click',()=>$('videoInput').click());
    $('videoInput').addEventListener('change',handleVideo);
    $('btnCloseViewer').addEventListener('click',()=>$('imageViewer').classList.remove('show'));
    $('btnBackToChat').addEventListener('click',()=>showPage('chat'));
    $('btnBackFromProfile').addEventListener('click',()=>showPage('chat'));
    document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>showPage(n.dataset.tab)));
    document.addEventListener('click',()=>$('contextMenu').classList.remove('show'));
    $('contextMenu').addEventListener('click',e=>{
      e.stopPropagation();
      const a=e.target.closest('.item')?.dataset.action;
      if(!a||!contextMsgId)return;
      if(a==='copy')copyMsg(contextMsgId);else if(a==='favorite')toggleFav(contextMsgId);else if(a==='recall')recallMsg(contextMsgId);
      $('contextMenu').classList.remove('show');
    });
    // 录音
    const mic=$('btnMic'),tip=$('recordTip');
    mic.addEventListener('touchstart',e=>{e.preventDefault();startY=e.touches[0].clientY;startRec()});
    mic.addEventListener('touchmove',e=>{if(!isRecording)return;if(startY-e.touches[0].clientY>60){tip.classList.add('cancel');tip.textContent='松开发送'}else{tip.classList.remove('cancel');tip.textContent='手指上滑取消'}});
    mic.addEventListener('touchend',e=>{if(!isRecording)return;tip.classList.remove('show','cancel');if(startY-(e.changedTouches[0]?.clientY||startY)>60)cancelRec();else stopRec()});
    mic.addEventListener('mousedown',e=>{startY=e.clientY;startRec()});
    window.addEventListener('mouseup',()=>{if(isRecording){tip.classList.remove('show','cancel');stopRec()}});
    // 头像
    $('myAvatarPH').addEventListener('click',openAvatar);
    $('myAvatarImg').addEventListener('click',openAvatar);
    $('btnCloseAvatar').addEventListener('click',()=>$('avatarModal').classList.remove('show'));
    $('btnPickPhoto').addEventListener('click',()=>$('avatarInput').click());
    $('avatarInput').addEventListener('change',handleAvatarPick);
  }

  init();
})();
</script>
</body>
</html>
