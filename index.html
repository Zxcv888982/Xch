<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BlueFlow · 社区</title>
  <style>
    :root {
      --pink: #fb7299;
      --pink-light: #fff0f4;
      --blue: #12b7f5;
      --blue-light: #e8f7fd;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --text: #18191c;
      --text-gray: #9499a0;
      --border: #e3e5e7;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 100%; flex-direction: column; gap: 12px; background: var(--bg);
    }
    .loading .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--pink); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .app { display: none; flex-direction: column; height: 100%; }
    .app.show { display: flex; }
    .page { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .page.active { display: flex; }

    /* 顶栏 */
    .top-bar {
      background: var(--surface);
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0; height: 50px;
    }
    .top-bar .back-btn {
      font-size: 1.3rem; cursor: pointer; width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; color: var(--text);
    }
    .top-bar .title {
      font-size: 1rem; font-weight: 600; flex: 1;
      display: flex; align-items: center; gap: 6px;
    }
    .top-bar .title .logo-icon {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), #ff6b9d);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: #fff;
    }
    .top-bar .badge {
      font-size: 0.65rem; color: var(--text-gray);
      background: var(--bg); padding: 3px 8px; border-radius: 10px;
    }
    .avatar-xs {
      width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
      cursor: pointer; flex-shrink: 0; border: 2px solid var(--pink-light);
    }
    .avatar-xs-ph {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--pink-light); display: flex; align-items: center;
      justify-content: center; font-size: 0.8rem; cursor: pointer; flex-shrink: 0;
    }

    .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* 瀑布流 */
    .masonry { columns: 2; column-gap: 8px; padding: 8px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden; margin-bottom: 8px;
      box-shadow: var(--shadow);
      break-inside: avoid; cursor: pointer;
      transition: transform 0.15s;
    }
    .card:active { transform: scale(0.98); }
    .card .card-cover {
      position: relative; background: #f0f0f0;
    }
    .card .card-cover img, .card .card-cover video {
      width: 100%; display: block; object-fit: cover;
      min-height: 100px; max-height: 250px;
    }
    .card .card-cover .duration {
      position: absolute; bottom: 6px; right: 6px;
      background: rgba(0,0,0,0.7); color: #fff;
      font-size: 0.6rem; padding: 2px 6px; border-radius: 4px;
    }
    .card .card-cover .play-icon {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; pointer-events: none;
    }
    .card .card-body { padding: 8px 10px; }
    .card .card-title {
      font-size: 0.78rem; font-weight: 500; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 4px;
    }
    .card .card-meta {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.65rem; color: var(--text-gray);
    }
    .card .card-meta .u-avatar { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; }
    .card .card-meta .stats { margin-left: auto; }

    /* 详情 */
    .detail-hd { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface); }
    .detail-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .detail-info { flex: 1; }
    .detail-name { font-weight: 600; font-size: 0.85rem; }
    .detail-time { font-size: 0.65rem; color: var(--text-gray); }
    .follow-btn {
      font-size: 0.6rem; padding: 2px 10px; border-radius: 10px;
      border: 1px solid var(--pink); color: var(--pink);
      background: transparent; cursor: pointer; margin-left: 6px;
    }
    .detail-body { padding: 10px 14px; font-size: 0.88rem; line-height: 1.7; background: var(--surface); }
    .detail-body img, .detail-body video { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    .detail-actions {
      display: flex; justify-content: space-around; padding: 8px 14px;
      background: var(--surface); border-top: 0.5px solid var(--border);
      border-bottom: 0.5px solid var(--border); font-size: 0.85rem;
    }
    .detail-actions .act {
      display: flex; align-items: center; gap: 4px; cursor: pointer;
      padding: 6px 12px; border-radius: 16px;
    }
    .detail-actions .act:active { background: var(--bg); }
    .detail-actions .act.liked { color: var(--pink); }
    .detail-actions .act.fav { color: #f5a623; }
    .comment-section { padding: 8px 14px; background: var(--surface); }
    .comment-item { display: flex; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid var(--bg); }
    .comment-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .comment-body { flex: 1; }
    .comment-name { font-weight: 600; font-size: 0.75rem; }
    .comment-text { font-size: 0.8rem; margin-top: 2px; }
    .comment-meta { font-size: 0.6rem; color: var(--text-gray); }

    /* 聊天 */
    .chat-list { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .msg-row { display: flex; gap: 6px; animation: msgIn 0.08s ease; }
    .msg-row.self { flex-direction: row-reverse; }
    .msg-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .msg-bubble { padding: 7px 10px; border-radius: 14px; font-size: 0.82rem; line-height: 1.4; word-break: break-word; background: var(--surface); max-width: 70%; box-shadow: var(--shadow); }
    .msg-row.self .msg-bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 3px; }
    .msg-bubble img { max-width: 140px; border-radius: 6px; display: block; }
    .msg-bubble video { max-width: 140px; border-radius: 6px; }
    .msg-time { font-size: 0.5rem; color: var(--text-gray); margin-top: 1px; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

    /* 底栏 */
    .tab-bar {
      background: var(--surface);
      display: flex; border-top: 0.5px solid var(--border);
      flex-shrink: 0; height: 48px;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-bar .tab {
      flex: 1; text-align: center; padding: 4px 0; font-size: 0.55rem;
      color: var(--text-gray); cursor: pointer;
    }
    .tab-bar .tab.active { color: var(--pink); }
    .tab-bar .tab span { font-size: 1.3rem; display: block; }
    .tab-bar .tab.publish span {
      background: linear-gradient(135deg, var(--pink), #ff6b9d);
      color: #fff; width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: -16px auto 1px; font-size: 1.5rem;
      box-shadow: 0 4px 14px rgba(251,114,153,0.35);
    }

    /* 发布弹窗 */
    .pub-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: var(--surface); z-index: 300; flex-direction: column; }
    .pub-overlay.show { display: flex; }
    .pub-top { display: flex; align-items: center; padding: 10px 14px; border-bottom: 0.5px solid var(--border); gap: 10px; }
    .pub-body { flex: 1; padding: 14px; overflow-y: auto; }
    .pub-body textarea { width: 100%; border: none; font-size: 1rem; resize: none; outline: none; font-family: inherit; line-height: 1.7; min-height: 120px; }
    .pub-preview { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .pub-preview img, .pub-preview video { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; }
    .pub-preview .add { width: 72px; height: 72px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: var(--text-gray); cursor: pointer; border: 2px dashed var(--border); }

    .input-row { display: flex; gap: 6px; padding: 6px 10px; background: var(--surface); border-top: 0.5px solid var(--border); align-items: center; }
    .input-row input { flex: 1; border: none; background: var(--bg); border-radius: 16px; padding: 7px 12px; font-size: 0.82rem; outline: none; height: 32px; }
    .btn-icon { width: 30px; height: 30px; border-radius: 50%; border: none; font-size: 1rem; cursor: pointer; background: var(--bg); display: flex; align-items: center; justify-content: center; }
    .btn-sm { padding: 5px 14px; border-radius: 14px; border: none; font-size: 0.78rem; cursor: pointer; font-weight: 500; }
    .btn-sm-pink { background: var(--pink); color: #fff; }
    .btn-sm-blue { background: var(--blue); color: #fff; }

    .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.35); z-index: 200; justify-content: center; align-items: center; }
    .modal.show { display: flex; }
    .modal-box { background: var(--surface); border-radius: var(--radius-lg); padding: 16px; width: 90%; max-width: 280px; text-align: center; }
    .emoji-row { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 8px 0; }
    .emoji-item { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; background: var(--bg); cursor: pointer; border: 2px solid transparent; }
    .emoji-item.sel { border-color: var(--pink); background: var(--pink-light); }
  </style>
</head>
<body>

<div class="loading" id="loading"><div class="spinner"></div><span style="color:var(--text-gray)">加载中...</span></div>

<div class="app" id="app">

  <!-- 首页 -->
  <div class="page active" id="homePage">
    <div class="top-bar">
      <div class="title"><span class="logo-icon">B</span>BlueFlow</div>
      <div class="badge" id="homeBadge">在线 0</div>
      <img class="avatar-xs" id="homeAvatarImg" src="" style="display:none">
      <div class="avatar-xs-ph" id="homeAvatarPH">😀</div>
    </div>
    <div class="scroll"><div class="masonry" id="masonryGrid"></div></div>
    <div class="tab-bar">
      <div class="tab active" data-page="home"><span>🏠</span>首页</div>
      <div class="tab" data-page="chat"><span>💬</span>聊天</div>
      <div class="tab publish" data-page="publish"><span>+</span></div>
      <div class="tab" data-page="notif"><span>🔔</span>动态</div>
      <div class="tab" data-page="profile"><span>👤</span>我的</div>
    </div>
  </div>

  <!-- 详情 -->
  <div class="page" id="detailPage">
    <div class="top-bar"><span class="back-btn" id="btnBack">←</span><span class="title">帖子详情</span></div>
    <div class="scroll"><div class="detail-hd" id="detailHeader"></div><div class="detail-body" id="detailContent"></div><div class="detail-actions" id="detailActions"></div><div class="comment-section" id="commentList"></div></div>
    <div class="input-row"><input type="text" id="commentInput" placeholder="发条评论..."><button class="btn-sm btn-sm-blue" id="btnComment">发送</button></div>
  </div>

  <!-- 聊天 -->
  <div class="page" id="chatPage">
    <div class="top-bar"><span class="back-btn" id="btnBackChat">←</span><span class="title">💬 聊天室</span><div class="badge" id="chatBadge">在线 0</div></div>
    <div class="chat-list" id="chatList"></div>
    <div class="input-row"><button class="btn-icon" id="btnImage">🖼</button><input type="text" id="msgInput" placeholder="输入消息..."><button class="btn-sm btn-sm-blue" id="btnSend">发送</button></div>
  </div>

  <!-- 通知 -->
  <div class="page" id="notifPage">
    <div class="top-bar"><span class="back-btn" id="btnBackNotif">←</span><span class="title">🔔 动态通知</span></div>
    <div class="scroll" style="padding:14px" id="notifList"></div>
  </div>

  <!-- 我的 -->
  <div class="page" id="profilePage">
    <div class="top-bar"><span class="back-btn" id="btnBackProfile">←</span><span class="title">👤 我的主页</span></div>
    <div class="scroll" style="padding:14px">
      <div style="text-align:center;margin-bottom:14px">
        <img style="width:56px;height:56px;border-radius:50%;object-fit:cover" id="profileAvatarImg" src="" style="display:none">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--pink-light);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto" id="profileAvatarPH">😀</div>
        <div style="font-weight:600;font-size:1rem;margin-top:6px" id="profileName"></div>
        <div style="color:var(--text-gray);font-size:0.75rem" id="profileUsername"></div>
      </div>
      <div class="masonry" id="profileMasonry"></div>
    </div>
  </div>
</div>

<div class="pub-overlay" id="pubOverlay">
  <div class="pub-top"><span class="back-btn" id="btnCancelPub">←</span><span style="flex:1;text-align:center;font-weight:600">发布动态</span><button class="btn-sm btn-sm-pink" id="btnSubmitPub">发布</button></div>
  <div class="pub-body"><textarea id="pubText" placeholder="分享新鲜事..."></textarea><div class="pub-preview" id="pubMedia"><div class="add" id="btnAddMedia">+</div></div></div>
</div>

<div class="modal" id="avatarModal">
  <div class="modal-box"><h3 style="margin-bottom:8px">选择头像</h3><div class="emoji-row" id="emojiGrid"></div><button class="btn-sm btn-sm-pink" id="btnPickPhoto">📷 相册</button><button class="btn-sm" style="background:var(--bg);margin-left:4px" id="btnCloseAv">完成</button></div>
</div>

<input type="file" id="imgInput" accept="image/*" style="display:none">
<input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none">
<input type="file" id="avatarInput" accept="image/*" style="display:none">

<script>
(async function(){
  const $=id=>document.getElementById(id);
  let user={username:null,nickname:'',avatar:'😀',avatarType:'emoji'},socket,clientId,posts=[],received=new Set(),online=0,curPost=null,lastSend=0,mediaFiles=[];
  const emojis=['😀','😎','🤖','👽','🐱','🦊','🐼','🐨','🦁','🐸','🐵','🦄','🐶','🐰','🦋','🌸'];
  const token=localStorage.getItem('chat_token');
  if(!token){localStorage.clear();location.href='/login.html';return}
  try{const r=await fetch('/api/auto-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();if(!d.success){localStorage.clear();location.href='/login.html';return}user={username:d.user.username,nickname:d.user.nickname,avatar:d.user.avatar,avatarType:d.user.avatarType||'emoji'}}catch(e){location.href='/login.html';return}
  $('loading').style.display='none';$('app').classList.add('show');updateAvatars();loadPosts();connectWS();bind();
  function updateAvatars(){const isImg=user.avatarType==='image'&&user.avatar;['home','profile'].forEach(p=>{const img=$(p+'AvatarImg'),ph=$(p+'AvatarPH');if(isImg){img.src=user.avatar;img.style.display='block';ph.style.display='none'}else{ph.textContent=user.avatar||'😀';img.style.display='none';ph.style.display='flex'}});$('profileName').textContent=user.nickname;$('profileUsername').textContent='@'+user.username}
  function go(p){document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));const m={home:'homePage',chat:'chatPage',notif:'notifPage',profile:'profilePage'};if(m[p])$(m[p]).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===p));if(p==='chat')loadChat();if(p==='profile')loadMyPosts();if(p==='notif')loadNotif()}
  async function loadPosts(){try{const r=await fetch('/api/posts');const d=await r.json();posts=d.success?d.posts:[];renderMasonry()}catch(e){}}
  function renderMasonry(){const g=$('masonryGrid');g.innerHTML='';if(!posts.length){g.innerHTML='<div style="text-align:center;color:var(--text-gray);padding:50px;grid-column:1/-1">📝 还没有动态</div>';return}[...posts].sort((a,b)=>b.timestamp-a.timestamp).forEach(p=>{const c=document.createElement('div');c.className='card';let m='';if(p.imageUrl)m=`<div class="card-cover"><img src="${p.imageUrl}" loading="lazy"></div>`;else if(p.videoUrl)m=`<div class="card-cover"><video src="${p.videoUrl}" preload="metadata"></video><div class="play-icon">▶</div></div>`;c.innerHTML=`${m}<div class="card-body"><div class="card-title">${esc(p.text||'')}</div><div class="card-meta">${p.avatarType==='image'?`<img class="u-avatar" src="${p.avatar}">`:p.avatar||'😀'} ${p.nickname}<span class="stats">❤${p.likes||0} 💬${(p.comments||[]).length}</span></div></div>`;c.addEventListener('click',()=>openPost(p.id));g.appendChild(c)})}
  function openPost(id){const p=posts.find(x=>x.id===id);if(!p)return;curPost=id;go('');$('detailPage').classList.add('active');$('detailHeader').innerHTML=`${p.avatarType==='image'?`<img class="detail-avatar" src="${p.avatar}">`:`<div class="detail-avatar" style="background:var(--pink-light);display:flex;align-items:center;justify-content:center;font-size:1rem">${p.avatar||'😀'}</div>`}<div class="detail-info"><div class="detail-name">${p.nickname}<button class="follow-btn">+关注</button></div><div class="detail-time">${new Date(p.timestamp).toLocaleString()}</div></div>`;let b=`<p>${esc(p.text||'')}</p>`;if(p.imageUrl)b+=`<img src="${p.imageUrl}">`;if(p.videoUrl)b+=`<video src="${p.videoUrl}" controls style="max-width:100%;border-radius:8px;margin-top:8px"></video>`;$('detailContent').innerHTML=b;$('detailActions').innerHTML=`<div class="act ${p.likedBy?.includes(user.username)?'liked':''}" data-a="like">❤️ ${p.likes||0}</div><div class="act ${p.favoritedBy?.includes(user.username)?'fav':''}" data-a="fav">⭐ ${p.favorites||0}</div><div class="act">💬 ${(p.comments||[]).length}</div>`;$('detailActions').querySelectorAll('.act').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.a==='like')toggleLike(id);if(el.dataset.a==='fav')toggleFav(id)}));renderComments()}
  function renderComments(){const p=posts.find(x=>x.id===curPost);if(!p)return;const l=$('commentList');l.innerHTML='';(p.comments||[]).forEach(c=>{l.innerHTML+=`<div class="comment-item">${c.avatarType==='image'?`<img class="comment-avatar" src="${c.avatar}">`:`<div class="comment-avatar" style="background:var(--pink-light);display:flex;align-items:center;justify-content:center;font-size:0.7rem">${c.avatar||'😀'}</div>`}<div class="comment-body"><div class="comment-name">${c.nickname}</div><div class="comment-text">${esc(c.text)}</div><div class="comment-meta">${new Date(c.timestamp).toLocaleString()}</div></div></div>`})}
  function toggleLike(id){const p=posts.find(x=>x.id===id);if(!p)return;if(!p.likedBy)p.likedBy=[];const i=p.likedBy.indexOf(user.username);i>-1?(p.likedBy.splice(i,1),p.likes--):(p.likedBy.push(user.username),p.likes++);openPost(id);savePosts()}
  function toggleFav(id){const p=posts.find(x=>x.id===id);if(!p)return;if(!p.favoritedBy)p.favoritedBy=[];const i=p.favoritedBy.indexOf(user.username);i>-1?(p.favoritedBy.splice(i,1),p.favorites--):(p.favoritedBy.push(user.username),p.favorites++);openPost(id);savePosts()}
  function addComment(){const t=$('commentInput').value.trim();if(!t||!curPost)return;const p=posts.find(x=>x.id===curPost);if(!p)return;p.comments.push({nickname:user.nickname,username:user.username,avatar:user.avatar,avatarType:user.avatarType,text:t,timestamp:Date.now()});renderComments();$('commentInput').value='';savePosts()}
  function savePosts(){fetch('/api/save-posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({posts})}).catch(()=>{})}
  function openPub(){$('pubOverlay').classList.add('show');$('pubText').value='';mediaFiles=[];renderPV()}
  function renderPV(){const pv=$('pubMedia');pv.innerHTML='';mediaFiles.forEach(f=>{const u=URL.createObjectURL(f);const el=f.type.startsWith('video')?document.createElement('video'):document.createElement('img');el.src=u;el.style.cssText='width:72px;height:72px;border-radius:8px;object-fit:cover';pv.appendChild(el)});const a=document.createElement('div');a.className='add';a.textContent='+';a.addEventListener('click',()=>$('mediaInput').click());pv.appendChild(a)}
  function submitPub(){const t=$('pubText').value.trim();if(!t&&!mediaFiles.length)return;const p={id:'p'+Date.now(),text:t,avatar:user.avatar,avatarType:user.avatarType,nickname:user.nickname,username:user.username,timestamp:Date.now(),likes:0,comments:[],favorites:0,likedBy:[],favoritedBy:[]};if(mediaFiles.length){const f=mediaFiles[0];const r=new FileReader();r.onloadend=()=>{if(f.type.startsWith('video'))p.videoUrl=r.result;else p.imageUrl=r.result;posts.unshift(p);savePosts();renderMasonry()};r.readAsDataURL(f)}else{posts.unshift(p);savePosts();renderMasonry()}$('pubOverlay').classList.remove('show')}
  function loadChat(){fetch('/api/messages').then(r=>r.json()).then(d=>{$('chatList').innerHTML='';if(d.success&&d.messages?.length)d.messages.forEach(m=>{received.add(m.msgId);addChatMsg(m,m.clientId===clientId||m.senderUsername===user.username)})})}
  function connectWS(){socket=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}`);socket.onopen=()=>{if(user.username)socket.send(JSON.stringify({type:'login',username:user.username}))};socket.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='message'){if(d.msgId&&received.has(d.msgId))return;received.add(d.msgId);addChatMsg(d,d.clientId===clientId||d.senderUsername===user.username)}else if(d.type==='userCount'){online=d.count;$('chatBadge').textContent=`在线 ${d.count}`;$('homeBadge').textContent=`在线 ${d.count}`}}catch(ex){}};socket.onclose=()=>setTimeout(connectWS,2000)}
  function addChatMsg(d,isSelf){const row=document.createElement('div');row.className=`msg-row ${isSelf?'self':''}`;const av=document.createElement('div');av.className='msg-avatar';if(d.avatarType==='image'){const i=document.createElement('img');i.src=d.avatar;i.style.cssText='width:28px;height:28px;border-radius:50%;object-fit:cover';av.appendChild(i)}else{av.style.cssText='width:28px;height:28px;border-radius:50%;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:0.7rem';av.textContent=d.avatar||'😀'}const b=document.createElement('div');b.className='msg-bubble';if(d.imageUrl){const i=document.createElement('img');i.src=d.imageUrl;b.appendChild(i)}else if(d.videoUrl){const v=document.createElement('video');v.src=d.videoUrl;v.controls=true;b.appendChild(v)}else b.textContent=d.text||'';const t=document.createElement('div');t.className='msg-time';t.textContent=new Date(d.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});const w=document.createElement('div');w.style.cssText='display:flex;flex-direction:column;max-width:70%';w.appendChild(b);w.appendChild(t);if(isSelf){row.appendChild(w);row.appendChild(av)}else{row.appendChild(av);row.appendChild(w)}$('chatList').appendChild(row);$('chatList').scrollTop=$('chatList').scrollHeight}
  function sendChat(){const t=$('msgInput').value.trim();if(!t||!socket||Date.now()-lastSend<300)return;lastSend=Date.now();socket.send(JSON.stringify({type:'message',text:t}));$('msgInput').value=''}
  function loadNotif(){$('notifList').innerHTML=`<div style="background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)"><div style="font-weight:600;color:var(--pink)">🟢 在线人数: ${online}</div></div>`}
  function loadMyPosts(){const mp=posts.filter(p=>p.username===user.username);const g=$('profileMasonry');g.innerHTML='';mp.forEach(p=>{const c=document.createElement('div');c.className='card';let m='';if(p.imageUrl)m=`<img src="${p.imageUrl}" loading="lazy">`;else if(p.videoUrl)m=`<video src="${p.videoUrl}" preload="metadata"></video>`;c.innerHTML=`${m?`<div class="card-cover">${m}</div>`:''}<div class="card-body"><div class="card-title">${esc(p.text||'')}</div><div class="card-meta"><span class="stats">❤${p.likes||0} 💬${(p.comments||[]).length}</span></div></div>`;c.addEventListener('click',()=>openPost(p.id));g.appendChild(c)})}
  function bind(){
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{if(t.dataset.page==='publish')openPub();else go(t.dataset.page)}));
    $('btnBack').addEventListener('click',()=>go('home'));
    $('btnBackChat').addEventListener('click',()=>go('home'));
    $('btnBackNotif').addEventListener('click',()=>go('home'));
    $('btnBackProfile').addEventListener('click',()=>go('home'));
    $('btnCancelPub').addEventListener('click',()=>$('pubOverlay').classList.remove('show'));
    $('btnSubmitPub').addEventListener('click',submitPub);
    $('btnAddMedia').addEventListener('click',()=>$('mediaInput').click());
    $('mediaInput').addEventListener('change',e=>{mediaFiles=[...e.target.files];renderPV()});
    $('btnComment').addEventListener('click',addComment);
    $('commentInput').addEventListener('keydown',e=>{if(e.key==='Enter')addComment()});
    $('btnSend').addEventListener('click',sendChat);
    $('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
    $('btnImage').addEventListener('click',()=>$('imgInput').click());
    $('imgInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onloadend=()=>socket?.send(JSON.stringify({type:'image',image:r.result.split(',')[1]}));r.readAsDataURL(f);$('imgInput').value=''});
    $('homeAvatarPH').addEventListener('click',openAvatar);$('homeAvatarImg').addEventListener('click',openAvatar);
    $('btnCloseAv').addEventListener('click',()=>$('avatarModal').classList.remove('show'));
    $('btnPickPhoto').addEventListener('click',()=>$('avatarInput').click());
    $('avatarInput').addEventListener('change',handleAvatar);
  }
  function openAvatar(){renderEmoji();$('avatarModal').classList.add('show')}
  function renderEmoji(){const g=$('emojiGrid');g.innerHTML='';emojis.forEach(e=>{const d=document.createElement('div');d.className='emoji-item';d.textContent=e;if(user.avatarType==='emoji'&&user.avatar===e)d.classList.add('sel');d.addEventListener('click',()=>{user.avatar=e;user.avatarType='emoji';updateAvatars();saveProfile();renderEmoji()});g.appendChild(d)})}
  function handleAvatar(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>h){if(w>200){h*=200/w;w=200}}else{if(h>200){w*=200/h;h=200}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);user.avatar=c.toDataURL('image/jpeg',0.7);user.avatarType='image';updateAvatars();saveProfile()};img.src=ev.target.result};r.readAsDataURL(f);$('avatarInput').value=''}
  function saveProfile(){fetch('/api/update-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.username,avatar:user.avatar,avatarType:user.avatarType})}).catch(()=>{})}
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
})();
</script>
</body>
</html>
