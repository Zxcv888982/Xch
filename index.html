<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>极速聊天室</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f6f7;height:100vh;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
    .page{display:none;flex-direction:column;height:100%}
    .page.active{display:flex}
    .login-page{justify-content:center;align-items:center;padding:24px;background:#f5f6f7}
    .login-card{background:#fff;border-radius:20px;padding:30px 24px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
    .login-card h2{text-align:center;margin-bottom:24px;font-size:1.4rem;color:#1a1a1a}
    .login-card input{width:100%;padding:12px 16px;border:1px solid #e0e0e0;border-radius:12px;font-size:1rem;margin-bottom:12px;outline:none;background:#f9f9f9}
    .login-card input:focus{border-color:#1677ff;background:#fff}
    .btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:8px}
    .btn-primary{background:#1677ff;color:#fff}
    .toggle-text{text-align:center;font-size:0.85rem;color:#999}
    .toggle-text span{color:#1677ff;cursor:pointer}
    .navbar{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e5e5e5;flex-shrink:0}
    .navbar .title{font-size:1.05rem;font-weight:600;color:#1a1a1a;flex:1}
    .navbar .online-badge{font-size:0.75rem;color:#999;background:#f0f0f0;padding:3px 8px;border-radius:10px}
    .nav-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid #e0e0e0;flex-shrink:0}
    .nav-avatar-placeholder{width:34px;height:34px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;flex-shrink:0}
    .msg-list{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#f5f6f7;-webkit-overflow-scrolling:touch;will-change:scroll-position}
    .msg-row{display:flex;flex-direction:column;max-width:78%;animation:msgIn 0.08s ease;position:relative;contain:content}
    .msg-row.self{align-self:flex-end;align-items:flex-end}
    .msg-row.other{align-self:flex-start;align-items:flex-start}
    .msg-row.favorited::before{content:'⭐';position:absolute;top:-6px;right:-4px;font-size:0.6rem;z-index:1}
    .msg-header{display:flex;align-items:center;gap:6px;margin-bottom:2px;cursor:pointer}
    .msg-row.self .msg-header{flex-direction:row-reverse}
    .msg-name{font-size:0.7rem;color:#999}
    .msg-header-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .msg-header-avatar-placeholder{width:22px;height:22px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:0.7rem;flex-shrink:0}
    .msg-bubble{padding:8px 12px;border-radius:16px;font-size:0.9rem;line-height:1.4;word-break:break-word;background:#fff;color:#1a1a1a;box-shadow:0 1px 1px rgba(0,0,0,0.04);display:inline-block;max-width:100%;cursor:pointer}
    .msg-row.self .msg-bubble{background:#1677ff;color:#fff;border-bottom-right-radius:4px}
    .msg-row.other .msg-bubble{border-bottom-left-radius:4px}
    .msg-bubble .mention{color:#ff8c00;font-weight:600}
    .msg-row.self .msg-bubble .mention{color:#ffe0a0}
    .msg-bubble img{max-width:200px;max-height:300px;border-radius:8px;display:block;cursor:pointer;object-fit:cover;background:#e8e8e8}
    .msg-bubble video{max-width:200px;max-height:300px;border-radius:8px;display:block;background:#000}
    .msg-bubble audio{max-width:180px;height:32px}
    .msg-bubble .media-loading{display:flex;align-items:center;justify-content:center;width:200px;height:100px;background:#e8e8e8;border-radius:8px;font-size:0.75rem;color:#999;flex-direction:column;gap:6px}
    .msg-bubble .media-loading .progress-bar{width:100px;height:4px;background:#ddd;border-radius:2px;overflow:hidden}
    .msg-bubble .media-loading .progress-bar div{height:100%;background:#1677ff;transition:width 0.3s}
    @keyframes spin{to{transform:rotate(360deg)}}
    .msg-time{font-size:0.6rem;color:#b0b0b0;margin-top:1px;padding:0 2px;display:flex;align-items:center;gap:4px}
    .msg-row.self .msg-time{justify-content:flex-end}
    .msg-size{color:#b0b0b0}
    .msg-recalled{font-style:italic;opacity:0.6}
    .system-msg{text-align:center;font-size:0.7rem;color:#b0b0b0;padding:4px;align-self:center}
    @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .input-bar{background:#fff;padding:8px 10px;display:flex;align-items:center;gap:6px;border-top:1px solid #e5e5e5;flex-shrink:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
    .input-bar input{flex:1;border:none;background:#f0f0f0;border-radius:18px;padding:8px 14px;font-size:0.9rem;outline:none;color:#1a1a1a;min-width:0}
    .icon-btn{width:34px;height:34px;border-radius:50%;border:none;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#f0f0f0}
    .btn-send{background:#1677ff;color:#fff;width:auto;padding:0 14px;border-radius:16px;font-size:0.85rem;font-weight:600}
    .btn-mic.recording{background:#ff4d4f;color:#fff}
    .record-tip{display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:12px;font-size:0.85rem;z-index:300;text-align:center}
    .record-tip.active{display:block}
    .record-tip.cancel{background:rgba(255,77,79,0.9)}
    .context-menu{display:none;position:fixed;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.2);z-index:400;padding:6px 0;min-width:130px}
    .context-menu.active{display:block}
    .context-menu .menu-item{padding:10px 16px;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:8px}
    .context-menu .menu-item:active{background:#f0f0f0}
    .context-menu .menu-item.danger{color:#ff4d4f}
    .mention-panel{display:none;position:absolute;bottom:60px;left:10px;right:10px;background:#fff;border-radius:12px;box-shadow:0 -2px 20px rgba(0,0,0,0.15);max-height:200px;overflow-y:auto;z-index:100}
    .mention-panel.active{display:block}
    .mention-item{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:0.9rem}
    .mention-item:active{background:#f0f0f0}
    .mention-item-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover}
    .mention-item-avatar-placeholder{width:28px;height:28px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:0.9rem}
    /* 主页样式 */
    .home-content{flex:1;overflow-y:auto;padding:12px}
    .profile-card{background:#fff;border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
    .profile-avatar{width:50px;height:50px;border-radius:50%;object-fit:cover}
    .profile-avatar-placeholder{width:50px;height:50px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
    .profile-info{flex:1}
    .profile-name{font-size:1rem;font-weight:600}
    .profile-username{font-size:0.8rem;color:#999}
    .profile-signature{font-size:0.75rem;color:#888;margin-top:2px}
    .btn-sm{padding:6px 14px;border-radius:14px;border:none;font-size:0.8rem;cursor:pointer;margin:2px}
    .btn-sm-outline{background:#fff;color:#1677ff;border:1px solid #1677ff}
    .btn-sm-danger{background:#fff;color:#ff4d4f;border:1px solid #ff4d4f}
    .section-title{font-size:0.8rem;color:#999;padding:8px 4px;display:flex;justify-content:space-between}
    .user-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-radius:12px;margin-bottom:6px;cursor:pointer}
    .user-item:active{background:#f0f0f0}
    .user-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover}
    .user-avatar-placeholder{width:38px;height:38px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
    .user-info{flex:1}
    .user-name{font-size:0.9rem;font-weight:500}
    .user-status{font-size:0.7rem;color:#4caf50}
    .user-signature{font-size:0.65rem;color:#999}
    .bottom-nav{background:#fff;display:flex;border-top:1px solid #e5e5e5;flex-shrink:0}
    .bottom-nav .nav-item{flex:1;text-align:center;padding:8px;font-size:0.7rem;color:#999;cursor:pointer}
    .bottom-nav .nav-item.active{color:#1677ff}
    .bottom-nav .nav-item span{font-size:1.2rem;display:block;margin-bottom:1px}
    /* 用户主页 */
    .user-profile-page{background:linear-gradient(180deg,#1677ff 0%,#0958d9 30%,#f5f6f7 30%,#f5f6f7 100%)}
    .profile-header{padding:20px;text-align:center;color:#fff}
    .profile-header .big-avatar{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #fff;margin-bottom:8px}
    .profile-header .big-avatar-placeholder{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.3);display:inline-flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:8px}
    .profile-header .big-name{font-size:1.3rem;font-weight:600}
    .profile-header .big-username{font-size:0.85rem;opacity:0.9}
    .profile-header .big-signature{font-size:0.8rem;opacity:0.8;margin-top:4px}
    .profile-header .online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:4px}
    .profile-header .offline-dot{background:#999}
    .profile-section{background:#fff;margin:12px;border-radius:14px;padding:14px}
    .profile-section h4{font-size:0.85rem;color:#333;margin-bottom:8px}
    .intimacy-grid{display:flex;flex-wrap:wrap;gap:8px}
    .intimacy-item{text-align:center;width:60px;cursor:pointer}
    .intimacy-item .int-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;margin:0 auto}
    .intimacy-item .int-avatar-placeholder{width:40px;height:40px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin:0 auto}
    .intimacy-item .int-name{font-size:0.65rem;color:#666;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .intimacy-item .int-count{font-size:0.6rem;color:#ff8c00}
    .recent-msg-item{padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:0.8rem;color:#666;display:flex;align-items:center;gap:8px}
    .recent-msg-item .time{font-size:0.65rem;color:#999;margin-left:auto}
    .img-viewer{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:500;justify-content:center;align-items:center;flex-direction:column}
    .img-viewer.active{display:flex}
    .img-viewer img,.img-viewer video{max-width:95%;max-height:80%;border-radius:8px}
    .img-viewer .close-btn{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.2);color:#fff;border:none;font-size:1.2rem;cursor:pointer}
    .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;justify-content:center;align-items:center}
    .modal-overlay.active{display:flex}
    .modal-panel{background:#fff;border-radius:16px;padding:18px;width:90%;max-width:320px;text-align:center}
    .modal-panel h3{margin-bottom:12px;font-size:0.95rem}
    .modal-panel textarea{width:100%;border:1px solid #e0e0e0;border-radius:8px;padding:8px;font-size:0.85rem;resize:none;margin-bottom:10px}
    .emoji-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
    .emoji-item{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:#f5f5f5;cursor:pointer;border:2px solid transparent}
    .emoji-item.selected{border-color:#1677ff;background:#e6f0ff}
    .modal-btn{padding:8px 18px;border-radius:16px;border:none;font-size:0.85rem;font-weight:600;cursor:pointer;margin:3px}
    .btn-outline{background:#fff;color:#1677ff;border:1px solid #1677ff}
  </style>
</head>
<body>

<!-- 登录 -->
<div class="page active" id="loginPage">
  <div class="login-card">
    <h2>🔐 登录聊天室</h2>
    <input type="text" id="loginUsername" placeholder="用户名" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password">
    <input type="text" id="loginNickname" placeholder="昵称（注册时需要）" style="display:none">
    <button class="btn btn-primary" id="btnLoginSubmit">登 录</button>
    <div class="toggle-text">没有账号？<span id="toggleMode">立即注册</span></div>
  </div>
</div>

<!-- 我的主页 -->
<div class="page" id="homePage">
  <div class="navbar">
    <div class="title">🏠 我的</div>
    <div class="online-badge" id="homeOnlineBadge">在线 0</div>
    <img class="nav-avatar" id="homeAvatarImg" src="" style="display:none">
    <div class="nav-avatar-placeholder" id="homeAvatarPlaceholder">😀</div>
  </div>
  <div class="home-content">
    <div class="profile-card">
      <img class="profile-avatar" id="profileAvatarImg" src="" style="display:none">
      <div class="profile-avatar-placeholder" id="profileAvatarPlaceholder">😀</div>
      <div class="profile-info">
        <div class="profile-name" id="profileName"></div>
        <div class="profile-username" id="profileUsername"></div>
        <div class="profile-signature" id="profileSignature"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <button class="btn-sm btn-sm-outline" id="btnEditAvatar">换头像</button>
        <button class="btn-sm btn-sm-outline" id="btnEditSignature">改签名</button>
      </div>
    </div>
    <button class="btn-sm btn-sm-danger" id="btnLogout" style="margin-bottom:12px;width:100%">退出登录</button>
    <div class="section-title"><span>在线用户</span><span id="homeOnlineCount">0人</span></div>
    <div id="onlineUserList"></div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item active" data-page="home"><span>🏠</span>我的</div>
    <div class="nav-item" data-page="chat"><span>💬</span>消息</div>
    <div class="nav-item" data-page="favorites"><span>⭐</span>收藏</div>
  </div>
</div>

<!-- 聊天页 -->
<div class="page" id="chatPage" style="position:relative">
  <div class="navbar">
    <div class="title">💬 聊天室</div>
    <div class="online-badge" id="onlineCount">在线 0</div>
    <img class="nav-avatar" id="myAvatarImg" src="" style="display:none">
    <div class="nav-avatar-placeholder" id="myAvatarPlaceholder">😀</div>
  </div>
  <div class="msg-list" id="messageList"></div>
  <div class="mention-panel" id="mentionPanel"></div>
  <div class="context-menu" id="contextMenu">
    <div class="menu-item" data-action="copy">📋 复制</div>
    <div class="menu-item" data-action="favorite">⭐ 收藏</div>
    <div class="menu-item danger" data-action="recall">🗑️ 撤回</div>
  </div>
  <div class="input-bar">
    <button class="icon-btn" id="btnImage">🖼️</button>
    <button class="icon-btn" id="btnVideo">🎬</button>
    <button class="icon-btn btn-mic" id="btnMic">🎤</button>
    <input type="text" id="msgInput" placeholder="输入消息，@ 艾特好友..." autocomplete="off">
    <button class="icon-btn btn-send" id="btnSend">发送</button>
  </div>
  <div class="record-tip" id="recordTip">手指上滑取消发送</div>
  <div class="bottom-nav">
    <div class="nav-item" data-page="home"><span>🏠</span>我的</div>
    <div class="nav-item active" data-page="chat"><span>💬</span>消息</div>
    <div class="nav-item" data-page="favorites"><span>⭐</span>收藏</div>
  </div>
</div>

<!-- 收藏页 -->
<div class="page" id="favoritesPage">
  <div class="navbar"><div class="title">⭐ 收藏</div></div>
  <div class="msg-list" id="favoritesList" style="flex:1"></div>
  <div class="bottom-nav">
    <div class="nav-item" data-page="home"><span>🏠</span>我的</div>
    <div class="nav-item" data-page="chat"><span>💬</span>消息</div>
    <div class="nav-item active" data-page="favorites"><span>⭐</span>收藏</div>
  </div>
</div>

<!-- 用户主页 -->
<div class="page user-profile-page" id="userProfilePage">
  <div class="navbar" style="background:transparent;border:none">
    <div class="title" style="color:#fff">👤 用户主页</div>
    <button class="icon-btn" id="btnBackFromProfile" style="background:rgba(255,255,255,0.3);color:#fff">✕</button>
  </div>
  <div class="home-content" style="padding:0">
    <div class="profile-header" id="userProfileHeader"></div>
    <div class="profile-section">
      <h4>💬 最近发言</h4>
      <div id="recentMsgsList"></div>
    </div>
    <div class="profile-section">
      <h4>💕 亲密关系</h4>
      <div class="intimacy-grid" id="intimacyList"></div>
    </div>
  </div>
</div>

<!-- 图片查看器 -->
<div class="img-viewer" id="imgViewer">
  <button class="close-btn" id="btnCloseImg">✕</button>
  <img id="imgViewerImg" src="" style="display:none">
  <video id="imgViewerVideo" controls style="display:none"></video>
</div>

<!-- 头像弹窗 -->
<div class="modal-overlay" id="avatarModal">
  <div class="modal-panel">
    <h3>选择头像</h3>
    <div class="emoji-grid" id="emojiGrid"></div>
    <button class="modal-btn btn-outline" id="btnPickPhoto">📷 从相册选择</button>
    <button class="modal-btn btn-primary" id="btnCloseModal">完成</button>
  </div>
</div>

<!-- 签名弹窗 -->
<div class="modal-overlay" id="signatureModal">
  <div class="modal-panel">
    <h3>修改个性签名</h3>
    <textarea id="signatureInput" rows="3" placeholder="写一句个性签名..."></textarea>
    <button class="modal-btn btn-primary" id="btnSaveSignature">保存</button>
    <button class="modal-btn btn-outline" id="btnCancelSignature">取消</button>
  </div>
</div>

<input type="file" id="imageFileInput" accept="image/*" style="display:none">
<input type="file" id="videoFileInput" accept="video/*" style="display:none">
<input type="file" id="avatarFileInput" accept="image/*" style="display:none">

<script>
(function(){
const $=id=>document.getElementById(id);
let socket=null,clientId=null,currentUser={username:null,nickname:'',avatar:'😀',avatarType:'emoji',signature:''},isLoginMode=true,mediaRecorder=null,audioChunks=[],isRecording=false,recordStartY=0,eventsBound=false,receivedMsgIds=new Set(),onlineUsers=[],favIds=[],contextMsgId=null,contextIsSelf=false;

const emojiList=['😀','😎','🤖','👽','🐱','🦊','🐼','🐨','🦁','🐸','🐵','🦄','🐶','🐰','🦋','🌸'];

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(item=>{
    const p=item.dataset.page;
    item.classList.toggle('active',(id==='homePage'&&p==='home')||(id==='chatPage'&&p==='chat')||(id==='favoritesPage'&&p==='favorites'));
  });
  if(id==='favoritesPage')loadFavorites();
  if(id==='homePage')loadOnlineUsers();
}

function init(){bindLoginEvents();bindGlobalEvents();autoLogin();}

function autoLogin(){
  const token=localStorage.getItem('chat_token');
  if(!token){showPage('loginPage');return}
  fetch('/api/auto-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})})
    .then(r=>r.json()).then(res=>{
      if(res.success){currentUser={username:res.user.username,nickname:res.user.nickname,avatar:res.user.avatar,avatarType:res.user.avatarType||'emoji',signature:res.user.signature||''};localStorage.setItem('chat_user',JSON.stringify(currentUser));enterApp()}
      else{localStorage.clear();showPage('loginPage')}
    }).catch(()=>showPage('loginPage'));
}

function enterApp(){showPage('homePage');updateAllAvatars();updateProfileCard();connectWebSocket();loadOnlineUsers();loadFavIds()}

function updateAllAvatars(){
  const isImg=currentUser.avatarType==='image'&&currentUser.avatar;
  const emoji=currentUser.avatar||'😀';
  [['homeAvatarImg','homeAvatarPlaceholder'],['myAvatarImg','myAvatarPlaceholder'],['profileAvatarImg','profileAvatarPlaceholder']].forEach(([imgId,phId])=>{
    if(isImg){$(imgId).src=currentUser.avatar;$(imgId).style.display='block';$(phId).style.display='none'}
    else{$(phId).textContent=emoji;$(imgId).style.display='none';$(phId).style.display='flex'}
  });
}

function updateProfileCard(){
  $('profileName').textContent=currentUser.nickname;
  $('profileUsername').textContent='@'+(currentUser.username||'未登录');
  $('profileSignature').textContent=currentUser.signature||'这个人很懒，什么都没写...';
}

function bindLoginEvents(){
  $('btnLoginSubmit').addEventListener('click',handleLogin);
  $('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});
  $('toggleMode').addEventListener('click',()=>{isLoginMode=!isLoginMode;$('btnLoginSubmit').textContent=isLoginMode?'登 录':'注 册';$('toggleMode').textContent=isLoginMode?'立即注册':'已有账号？去登录';$('loginNickname').style.display=isLoginMode?'none':'block'});
}

function handleLogin(){
  const username=$('loginUsername').value.trim(),password=$('loginPassword').value.trim();
  if(!username||!password)return alert('请填写完整');
  const endpoint=isLoginMode?'/api/login':'/api/register',body={username,password};
  if(!isLoginMode)body.nickname=$('loginNickname').value.trim()||username;
  fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()).then(res=>{
    if(res.success){if(isLoginMode){localStorage.setItem('chat_token',res.token);currentUser={username:res.user.username,nickname:res.user.nickname,avatar:res.user.avatar,avatarType:res.user.avatarType||'emoji',signature:res.user.signature||''};localStorage.setItem('chat_user',JSON.stringify(currentUser));enterApp()}else{alert('注册成功！请登录');isLoginMode=true;$('btnLoginSubmit').textContent='登 录';$('toggleMode').textContent='立即注册';$('loginNickname').style.display='none'}}
    else alert(res.message||'操作失败')
  }).catch(()=>alert('网络错误'));
}

function bindGlobalEvents(){
  if(eventsBound)return;eventsBound=true;
  $('btnLogout').addEventListener('click',()=>{localStorage.clear();location.reload()});
  $('btnEditAvatar').addEventListener('click',openAvatarModal);
  $('btnEditSignature').addEventListener('click',()=>{$('signatureInput').value=currentUser.signature||'';$('signatureModal').classList.add('active')});
  $('btnSaveSignature').addEventListener('click',()=>{currentUser.signature=$('signatureInput').value.trim();updateProfileCard();saveProfile();$('signatureModal').classList.remove('active')});
  $('btnCancelSignature').addEventListener('click',()=>$('signatureModal').classList.remove('active'));
  $('btnBackFromProfile').addEventListener('click',()=>showPage('homePage'));
  document.querySelectorAll('.nav-item').forEach(item=>item.addEventListener('click',()=>{
    const p=item.dataset.page;
    if(p==='home')showPage('homePage');else if(p==='chat'){showPage('chatPage');scrollToBottom()}else if(p==='favorites')showPage('favoritesPage');
  }));
  $('btnSend').addEventListener('click',sendText);
  $('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});
  $('msgInput').addEventListener('input',handleMentionInput);
  $('btnImage').addEventListener('click',()=>$('imageFileInput').click());
  $('imageFileInput').addEventListener('change',handleImage);
  $('btnVideo').addEventListener('click',()=>$('videoFileInput').click());
  $('videoFileInput').addEventListener('change',handleVideo);
  $('btnCloseImg').addEventListener('click',()=>$('imgViewer').classList.remove('active'));
  document.addEventListener('click',()=>$('contextMenu').classList.remove('active'));
  $('contextMenu').addEventListener('click',e=>{e.stopPropagation();const action=e.target.closest('.menu-item')?.dataset.action;if(!action||!contextMsgId)return;if(action==='copy')copyMessage(contextMsgId);else if(action==='favorite')toggleFavorite(contextMsgId);else if(action==='recall')recallMessage(contextMsgId);$('contextMenu').classList.remove('active')});
  const mic=$('btnMic'),tip=$('recordTip');
  mic.addEventListener('touchstart',e=>{e.preventDefault();recordStartY=e.touches[0].clientY;startRecording()});
  mic.addEventListener('touchmove',e=>{if(!isRecording)return;if(recordStartY-e.touches[0].clientY>60){tip.classList.add('cancel');tip.textContent='松开取消发送'}else{tip.classList.remove('cancel');tip.textContent='手指上滑取消发送'}});
  mic.addEventListener('touchend',e=>{if(!isRecording)return;tip.classList.remove('active','cancel');if(recordStartY-(e.changedTouches[0]?.clientY||recordStartY)>60)cancelRecording();else stopRecording()});
  mic.addEventListener('mousedown',e=>{recordStartY=e.clientY;startRecording()});
  window.addEventListener('mouseup',()=>{if(isRecording){tip.classList.remove('active','cancel');stopRecording()}});
  ['myAvatarPlaceholder','myAvatarImg','homeAvatarPlaceholder','homeAvatarImg'].forEach(id=>$(id).addEventListener('click',openAvatarModal));
  $('btnCloseModal').addEventListener('click',()=>$('avatarModal').classList.remove('active'));
  $('avatarModal').addEventListener('click',e=>{if(e.target===$('avatarModal'))$('avatarModal').classList.remove('active')});
  $('btnPickPhoto').addEventListener('click',()=>$('avatarFileInput').click());
  $('avatarFileInput').addEventListener('change',handleAvatarSelect);
}

function openAvatarModal(){renderEmojiGrid();$('avatarModal').classList.add('active')}
function renderEmojiGrid(){const grid=$('emojiGrid');grid.innerHTML='';emojiList.forEach(emoji=>{const div=document.createElement('div');div.className='emoji-item';div.textContent=emoji;if(currentUser.avatarType==='emoji'&&currentUser.avatar===emoji)div.classList.add('selected');div.addEventListener('click',()=>{currentUser.avatar=emoji;currentUser.avatarType='emoji';updateAllAvatars();saveProfile();renderEmojiGrid();localStorage.setItem('chat_user',JSON.stringify(currentUser))});grid.appendChild(div)})}
function saveProfile(){
  if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'update-profile',nickname:currentUser.nickname,avatar:currentUser.avatar,avatarType:currentUser.avatarType,signature:currentUser.signature}));
  if(currentUser.username)fetch('/api/update-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,nickname:currentUser.nickname,avatar:currentUser.avatar,avatarType:currentUser.avatarType,signature:currentUser.signature})}).catch(()=>{});
}
function handleAvatarSelect(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');let w=img.width,h=img.height;if(w>h){if(w>200){h*=200/w;w=200}}else{if(h>200){w*=200/h;h=200}}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);currentUser.avatar=canvas.toDataURL('image/jpeg',0.7);currentUser.avatarType='image';updateAllAvatars();saveProfile();renderEmojiGrid();localStorage.setItem('chat_user',JSON.stringify(currentUser))};img.src=ev.target.result};reader.readAsDataURL(file);$('avatarFileInput').value='';
}

function connectWebSocket(){
  if(socket){socket.onclose=null;socket.onmessage=null;socket.onopen=null;socket.close()}
  socket=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}`);
  socket.onopen=()=>{if(currentUser.username)socket.send(JSON.stringify({type:'login',username:currentUser.username}))};
  socket.onmessage=event=>{try{handleWsMessage(JSON.parse(event.data))}catch(e){}};
  socket.onclose=()=>setTimeout(connectWebSocket,2000);
}

function handleWsMessage(data){
  switch(data.type){
    case'welcome':clientId=data.clientId;break;
    case'login_success':clientId=data.clientId||clientId;currentUser.nickname=data.nickname;currentUser.avatar=data.avatar;currentUser.avatarType=data.avatarType||'emoji';currentUser.signature=data.signature||'';updateAllAvatars();updateProfileCard();localStorage.setItem('chat_user',JSON.stringify(currentUser));break;
    case'profile_updated':currentUser.nickname=data.nickname||currentUser.nickname;currentUser.avatar=data.avatar||currentUser.avatar;currentUser.avatarType=data.avatarType||currentUser.avatarType;currentUser.signature=data.signature!==undefined?data.signature:currentUser.signature;updateAllAvatars();updateProfileCard();localStorage.setItem('chat_user',JSON.stringify(currentUser));break;
    case'message':if(data.msgId&&receivedMsgIds.has(data.msgId))return;if(data.msgId)receivedMsgIds.add(data.msgId);appendMessage(data,data.clientId===clientId);break;
    case'message-recalled':const el=document.querySelector(`[data-msgid="${data.msgId}"]`);if(el){const bubble=el.querySelector('.msg-bubble');if(bubble){bubble.textContent='[消息已撤回]';bubble.classList.add('msg-recalled');bubble.querySelectorAll('img,video,audio,.media-loading').forEach(c=>c.remove())}}break;
    case'system':addSystemMsg(data.text);break;
    case'onlineUsers':onlineUsers=data.users||[];$('onlineCount').textContent=`在线 ${data.count}`;$('homeOnlineBadge').textContent=`在线 ${data.count}`;$('homeOnlineCount').textContent=`${data.count}人`;renderOnlineUserList();break;
  }
}

function appendMessage(data,isSelf,containerId='messageList'){
  const row=document.createElement('div');row.className=`msg-row ${isSelf?'self':'other'}`;row.dataset.msgid=data.msgId||'';if(favIds.includes(data.msgId))row.classList.add('favorited');
  const header=document.createElement('div');header.className='msg-header';
  header.addEventListener('click',()=>openUserProfile(data.senderUsername));
  const name=document.createElement('span');name.className='msg-name';name.textContent=isSelf?'我':(data.sender||'匿名');
  const av=document.createElement('div');
  if(data.avatarType==='image'&&data.avatar)av.innerHTML=`<img class="msg-header-avatar" src="${data.avatar}">`;
  else av.innerHTML=`<div class="msg-header-avatar-placeholder">${data.avatar||'😀'}</div>`;
  if(isSelf){header.appendChild(av);header.appendChild(name)}else{header.appendChild(name);header.appendChild(av)}
  const bubble=document.createElement('div');bubble.className='msg-bubble';
  if(data.recalled){bubble.textContent='[消息已撤回]';bubble.classList.add('msg-recalled')}
  else if(data.videoUrl){createMediaElement(bubble,'video',data.videoUrl,data.fileSize)}
  else if(data.imageUrl){createMediaElement(bubble,'image',data.imageUrl,data.fileSize)}
  else if(data.audioUrl){const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=data.audioUrl;bubble.appendChild(audio)}
  else{const text=highlightMentions(data.text||'',data.mentions||[]);bubble.innerHTML=text}
  bubble.addEventListener('touchstart',e=>{if(e.touches.length===1)startLongPress(e,data,isSelf)});
  bubble.addEventListener('touchend',clearLongPress);bubble.addEventListener('touchmove',clearLongPress);
  bubble.addEventListener('contextmenu',e=>{e.preventDefault();showContextMenu(e,data,isSelf)});
  const time=document.createElement('div');time.className='msg-time';
  time.innerHTML=`${data.timestamp?new Date(data.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''}${data.fileSize?`<span class="msg-size">${formatSize(data.fileSize)}</span>`:''}`;
  row.appendChild(header);row.appendChild(bubble);row.appendChild(time);
  $(containerId).appendChild(row);
  if(containerId==='messageList')scrollToBottom();
}

function formatSize(size){if(!size)return'';return size>=1024?`${(size/1024).toFixed(1)}MB`:`${size}KB`}

function createMediaElement(bubble,type,src,size){
  const loadingDiv=document.createElement('div');loadingDiv.className='media-loading';
  loadingDiv.innerHTML=`<span>${size?formatSize(size):''}</span><div class="progress-bar"><div style="width:0%"></div></div>`;
  bubble.appendChild(loadingDiv);
  const media=type==='image'?document.createElement('img'):document.createElement('video');
  if(type==='video'){media.controls=true;media.preload='metadata'}
  media.src=src;media.style.display='none';
  let progress=0;const timer=setInterval(()=>{progress+=15;if(progress>90)clearInterval(timer);loadingDiv.querySelector('.progress-bar div').style.width=progress+'%'},100);
  media.onloadedmetadata=()=>{clearInterval(timer);loadingDiv.querySelector('.progress-bar div').style.width='100%';setTimeout(()=>{loadingDiv.replaceWith(media);media.style.display='block';if(type==='image')media.addEventListener('click',()=>openViewer({imageUrl:src}))},150)};
  media.onerror=()=>{clearInterval(timer);loadingDiv.innerHTML='加载失败'};
  bubble.appendChild(media);
}

let longPressTimer=null;
function startLongPress(e,data,isSelf){clearLongPress();longPressTimer=setTimeout(()=>showContextMenu(e,data,isSelf),500)}
function clearLongPress(){if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}}

function showContextMenu(e,data,isSelf){
  const menu=$('contextMenu');contextMsgId=data.msgId;contextIsSelf=isSelf;
  menu.querySelector('[data-action="recall"]').style.display=isSelf&&!data.recalled&&(Date.now()-data.timestamp<120000)?'flex':'none';
  menu.querySelector('[data-action="copy"]').style.display=data.text&&!data.recalled?'flex':'none';
  const x=(e.touches?e.touches[0].clientX:e.clientX)||100,y=(e.touches?e.touches[0].clientY:e.clientY)||200;
  menu.style.left=Math.min(x,window.innerWidth-140)+'px';menu.style.top=Math.min(y,window.innerHeight-120)+'px';menu.classList.add('active');
}

function copyMessage(msgId){const el=document.querySelector(`[data-msgid="${msgId}"]`);if(el){const text=el.querySelector('.msg-bubble')?.textContent;if(text)navigator.clipboard?.writeText(text).then(()=>addSystemMsg('已复制')).catch(()=>{})}}
function toggleFavorite(msgId){fetch('/api/toggle-favorite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,msgId})}).then(r=>r.json()).then(res=>{if(res.success){favIds=res.favIds;document.querySelectorAll(`[data-msgid="${msgId}"]`).forEach(el=>el.classList.toggle('favorited',res.isFavorited));addSystemMsg(res.isFavorited?'已收藏':'已取消收藏')}})}
function recallMessage(msgId){if(!confirm('撤回这条消息？'))return;fetch('/api/recall-message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msgId,username:currentUser.username})}).then(r=>r.json()).then(res=>{if(!res.success)alert(res.message)})}
function openViewer(data){$('imgViewer').classList.add('active');if(data.videoUrl){$('imgViewerVideo').src=data.videoUrl;$('imgViewerVideo').style.display='block';$('imgViewerImg').style.display='none'}else{$('imgViewerImg').src=data.imageUrl;$('imgViewerImg').style.display='block';$('imgViewerVideo').style.display='none'}}

function highlightMentions(text,mentions){let html=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');mentions.forEach(m=>{html=html.replace(new RegExp(`@${m.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}`,'g'),`<span class="mention">@${m}</span>`)});return html}
function addSystemMsg(text){const div=document.createElement('div');div.className='system-msg';div.textContent=text;$('messageList').appendChild(div);scrollToBottom()}
function scrollToBottom(){const list=$('messageList');requestAnimationFrame(()=>{list.scrollTop=list.scrollHeight})}

function loadHistoryMessages(){
  $('messageList').innerHTML='';
  fetch('/api/messages').then(r=>r.json()).then(res=>{
    if(res.success&&res.messages?.length){const fragment=document.createDocumentFragment();res.messages.forEach(msg=>{if(msg.msgId)receivedMsgIds.add(msg.msgId);const isSelf=(msg.senderUsername&&msg.senderUsername===currentUser.username)||(msg.clientId&&msg.clientId===clientId);fragment.appendChild(createMsgRow(msg,isSelf))});$('messageList').appendChild(fragment)}
    else $('messageList').innerHTML='<div class="system-msg">暂无消息</div>';
    scrollToBottom();
  });
}

function createMsgRow(data,isSelf){
  const row=document.createElement('div');row.className=`msg-row ${isSelf?'self':'other'}`;row.dataset.msgid=data.msgId||'';if(favIds.includes(data.msgId))row.classList.add('favorited');
  const header=document.createElement('div');header.className='msg-header';header.addEventListener('click',()=>openUserProfile(data.senderUsername));
  const name=document.createElement('span');name.className='msg-name';name.textContent=isSelf?'我':(data.sender||'匿名');
  const av=document.createElement('div');if(data.avatarType==='image'&&data.avatar)av.innerHTML=`<img class="msg-header-avatar" src="${data.avatar}">`;else av.innerHTML=`<div class="msg-header-avatar-placeholder">${data.avatar||'😀'}</div>`;
  if(isSelf){header.appendChild(av);header.appendChild(name)}else{header.appendChild(name);header.appendChild(av)}
  const bubble=document.createElement('div');bubble.className='msg-bubble';
  if(data.recalled){bubble.textContent='[消息已撤回]';bubble.classList.add('msg-recalled')}
  else if(data.videoUrl)createMediaElement(bubble,'video',data.videoUrl,data.fileSize);
  else if(data.imageUrl)createMediaElement(bubble,'image',data.imageUrl,data.fileSize);
  else if(data.audioUrl){const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=data.audioUrl;bubble.appendChild(audio)}
  else bubble.innerHTML=highlightMentions(data.text||'',data.mentions||[]);
  bubble.addEventListener('touchstart',e=>{if(e.touches.length===1)startLongPress(e,data,isSelf)});
  bubble.addEventListener('touchend',clearLongPress);bubble.addEventListener('touchmove',clearLongPress);
  const time=document.createElement('div');time.className='msg-time';time.innerHTML=`${data.timestamp?new Date(data.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''}${data.fileSize?`<span class="msg-size">${formatSize(data.fileSize)}</span>`:''}`;
  row.appendChild(header);row.appendChild(bubble);row.appendChild(time);
  return row;
}

function loadFavorites(){
  fetch(`/api/favorites?username=${currentUser.username}`).then(r=>r.json()).then(res=>{
    $('favoritesList').innerHTML='';
    if(res.success&&res.favorites?.length)res.favorites.forEach(msg=>{const isSelf=(msg.senderUsername&&msg.senderUsername===currentUser.username);$('favoritesList').appendChild(createMsgRow(msg,isSelf))});
    else $('favoritesList').innerHTML='<div class="system-msg">暂无收藏</div>';
  });
}

function loadFavIds(){fetch(`/api/favorites?username=${currentUser.username}`).then(r=>r.json()).then(res=>{if(res.success){favIds=res.favIds||[]}})}

function loadOnlineUsers(){
  fetch('/api/online-users').then(r=>r.json()).then(res=>{
    if(res.success){onlineUsers=res.users||[];$('homeOnlineBadge').textContent=`在线 ${res.count}`;$('homeOnlineCount').textContent=`${res.count}人`;renderOnlineUserList()}
  });
}

function renderOnlineUserList(){
  const list=$('onlineUserList');list.innerHTML='';
  if(onlineUsers.length)onlineUsers.forEach(u=>{
    const div=document.createElement('div');div.className='user-item';
    div.innerHTML=`<div class="user-avatar-placeholder">${u.avatarType==='image'?`<img class="user-avatar" src="${u.avatar}">`:u.avatar||'😀'}</div><div class="user-info"><div class="user-name">${u.nickname}</div><div class="user-status">在线</div>${u.signature?`<div class="user-signature">${u.signature}</div>`:''}</div>`;
    div.addEventListener('click',()=>openUserProfile(u.username));
    list.appendChild(div);
  });
  else list.innerHTML='<div style="text-align:center;color:#999;padding:20px;">暂无在线用户</div>';
}

function openUserProfile(username){
  if(!username||username===currentUser.username){showPage('homePage');return}
  fetch(`/api/user-profile?username=${username}`).then(r=>r.json()).then(res=>{
    if(!res.success)return alert('用户不存在');
    const p=res.profile;
    const header=$('userProfileHeader');
    header.innerHTML=`
      ${p.avatarType==='image'?`<img class="big-avatar" src="${p.avatar}">`:`<div class="big-avatar-placeholder">${p.avatar||'😀'}</div>`}
      <div class="big-name">${p.nickname}${p.isOnline?' <span class="online-dot"></span>':''}</div>
      <div class="big-username">@${p.username}</div>
      <div class="big-signature">${p.signature||'这个人很懒，什么都没写...'}</div>
    `;
    const recent=$('recentMsgsList');recent.innerHTML='';
    if(res.recentMsgs?.length)res.recentMsgs.forEach(msg=>{
      const div=document.createElement('div');div.className='recent-msg-item';
      div.innerHTML=`<span>${msg.text||'[图片/视频]'}</span><span class="time">${new Date(msg.timestamp).toLocaleDateString('zh-CN')}</span>`;
      recent.appendChild(div);
    });else recent.innerHTML='<div style="color:#999;font-size:0.8rem">暂无发言</div>';
    const intimacy=$('intimacyList');intimacy.innerHTML='';
    if(res.intimacyList?.length)res.intimacyList.forEach(item=>{
      const div=document.createElement('div');div.className='intimacy-item';
      div.innerHTML=`${item.avatarType==='image'?`<img class="int-avatar" src="${item.avatar}">`:`<div class="int-avatar-placeholder">${item.avatar||'😀'}</div>`}<div class="int-name">${item.nickname}</div><div class="int-count">💕${item.count}</div>`;
      div.addEventListener('click',()=>openUserProfile(item.username));
      intimacy.appendChild(div);
    });else intimacy.innerHTML='<div style="color:#999;font-size:0.8rem">暂无亲密关系</div>';
    showPage('userProfilePage');
  });
}

function handleMentionInput(){
  const val=$('msgInput').value,cursorPos=$('msgInput').selectionStart;
  const atMatch=val.substring(0,cursorPos).match(/@([\u4e00-\u9fa5\w]*)$/);
  if(atMatch){const filtered=onlineUsers.filter(u=>u.username!==currentUser.username&&(u.nickname.toLowerCase().includes(atMatch[1].toLowerCase())||u.username.toLowerCase().includes(atMatch[1].toLowerCase())));showMentionPanel(filtered)}
  else $('mentionPanel').classList.remove('active');
}
function showMentionPanel(users){
  const panel=$('mentionPanel');if(!users.length){panel.classList.remove('active');return}
  panel.innerHTML='';users.slice(0,8).forEach(u=>{const div=document.createElement('div');div.className='mention-item';div.innerHTML=`${u.avatarType==='image'?`<img class="mention-item-avatar" src="${u.avatar}">`:`<div class="mention-item-avatar-placeholder">${u.avatar||'😀'}</div>`}<span>${u.nickname}</span>`;div.addEventListener('click',()=>{insertMention(u.nickname);panel.classList.remove('active')});panel.appendChild(div)});
  panel.classList.add('active');
}
function insertMention(nickname){const input=$('msgInput'),val=input.value,cursorPos=input.selectionStart,beforeAt=val.lastIndexOf('@',cursorPos);input.value=val.substring(0,beforeAt)+`@${nickname} `+val.substring(cursorPos);input.focus();input.setSelectionRange(beforeAt+nickname.length+2,beforeAt+nickname.length+2)}

function sendText(){
  const text=$('msgInput').value.trim();if(!text||socket?.readyState!==WebSocket.OPEN)return;
  const mentions=[...text.matchAll(/@([\u4e00-\u9fa5\w]+)/g)].map(m=>m[1]).filter((v,i,a)=>a.indexOf(v)===i);
  socket.send(JSON.stringify({type:'message',text,mentions}));
  $('msgInput').value='';$('msgInput').focus();$('mentionPanel').classList.remove('active');
}

function handleImage(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onloadend=()=>{
    const localId='local_'+Date.now();
    const localMsg={type:'message',msgId:localId,imageUrl:reader.result,sender:currentUser.nickname,senderUsername:currentUser.username,avatar:currentUser.avatar,avatarType:currentUser.avatarType,timestamp:Date.now(),clientId,recalled:false,fileSize:Math.round(file.size/1024)};
    appendMessage(localMsg,true);scrollToBottom();
    const base64=reader.result.split(',')[1];
    if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'image',image:base64,msgId:localId}));
  };reader.readAsDataURL(file);$('imageFileInput').value='';
}

function handleVideo(e){
  const file=e.target.files[0];if(!file||file.size>50*1024*1024)return alert('视频不能超过50MB');
  const reader=new FileReader();
  reader.onloadend=()=>{
    const localId='local_'+Date.now();
    const localMsg={type:'message',msgId:localId,videoUrl:reader.result,sender:currentUser.nickname,senderUsername:currentUser.username,avatar:currentUser.avatar,avatarType:currentUser.avatarType,timestamp:Date.now(),clientId,recalled:false,fileSize:Math.round(file.size/(1024*1024)*10)/10};
    appendMessage(localMsg,true);scrollToBottom();
    const base64=reader.result.split(',')[1];
    if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'video',video:'data:video/mp4;base64,'+base64,msgId:localId}));
  };reader.readAsDataURL(file);$('videoFileInput').value='';
}

async function startRecording(){
  if(mediaRecorder?.state==='recording')return;
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data)};mediaRecorder.onstop=()=>{if(!audioChunks.length)return;const blob=new Blob(audioChunks,{type:'audio/webm'});const reader=new FileReader();reader.onloadend=()=>{if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'audio',audio:reader.result.split(',')[1]}))};reader.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};mediaRecorder.start();isRecording=true;$('btnMic').classList.add('recording');$('recordTip').classList.add('active')}catch(err){alert('无法访问麦克风')}
}
function stopRecording(){if(mediaRecorder&&isRecording&&mediaRecorder.state==='recording')mediaRecorder.stop();isRecording=false;$('btnMic').classList.remove('recording');$('recordTip').classList.remove('active','cancel')}
function cancelRecording(){if(mediaRecorder&&isRecording&&mediaRecorder.state==='recording'){audioChunks=[];mediaRecorder.onstop=()=>{};mediaRecorder.stop()}isRecording=false;$('btnMic').classList.remove('recording');$('recordTip').classList.remove('active','cancel')}

init();
})();
</script>
</body>
