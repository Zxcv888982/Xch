<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>登录聊天室</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #1a1e2b 0%, #2a2f3f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 16px;
    }

    .auth-container {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .auth-container h2 {
      color: #f0e9e1;
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-container input {
      width: 100%;
      background: rgba(20,22,30,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .auth-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4f7df3, #3862c4);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .auth-toggle {
      text-align: center;
      color: #8b93a8;
      font-size: 0.9rem;
    }
    .auth-toggle span {
      color: #5f9ef0;
      cursor: pointer;
      text-decoration: underline;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 85vh;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius: 36px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.5);
      display: none;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .chat-header {
      padding: 14px 20px;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .avatar-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid white;
      cursor: pointer;
      object-fit: cover;
      background: rgba(255,255,255,0.2);
    }
    .header-info { flex: 1; }
    .header-info h3 { color: #f0e9e1; font-size: 1rem; }
    .header-info small { color: #a0aab8; font-size: 0.75rem; }
    .status-badge {
      background: #7ee0b8;
      color: #0a0f14;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .messages-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeInUp 0.2s ease-out;
    }
    .message.self { align-self: flex-end; align-items: flex-end; }
    .message.other { align-self: flex-start; align-items: flex-start; }
    .message .bubble {
      padding: 10px 14px;
      border-radius: 20px;
      background: rgba(40,45,60,0.85);
      color: #f0f0f0;
      font-size: 0.95rem;
    }
    .message.self .bubble {
      background: linear-gradient(135deg, #4b7bec, #3b6fd4);
      color: white;
    }
    .message .bubble img { max-width: 200px; border-radius: 12px; }
    .message .meta {
      font-size: 0.7rem;
      color: #b9c2d4;
      margin: 2px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .small-avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255,255,255,0.2);
    }
    .system-message {
      text-align: center;
      color: #adb9cf;
      font-size: 0.8rem;
      padding: 4px 12px;
      align-self: center;
    }
    .input-area {
      display: flex;
      padding: 12px;
      gap: 8px;
      background: rgba(0,0,0,0.4);
      align-items: center;
    }
    .input-area input {
      flex: 1;
      background: rgba(20,22,30,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      padding: 12px 16px;
      color: white;
      outline: none;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .send-btn { background: #4f7df3; }
    .voice-btn { background: #f39c12; }
    .voice-btn.recording { background: #e74c3c; animation: pulse 1s infinite; }
    .image-btn { background: #2ecc71; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(231,76,60,0.7); }
      70% { box-shadow: 0 0 0 12px rgba(231,76,60,0); }
      100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* 头像选择弹窗 */
    .avatar-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .avatar-modal.active { display: flex; }
    .avatar-panel {
      background: #2a2f3f;
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      min-width: 280px;
    }
    .avatar-panel h3 {
      color: #f0e9e1;
      margin-bottom: 16px;
    }
    .avatar-options {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .avatar-option {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
    }
    .avatar-option.selected { border-color: #5f9ef0; }
    .avatar-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #4f7df3; }
    .btn-secondary { background: #555; }
  </style>
</head>
<body>

<!-- 登录页面 -->
<div id="authPage" class="auth-container">
  <h2>🔐 登录聊天室</h2>
  <input type="text" id="authUsername" placeholder="用户名" />
  <input type="password" id="authPassword" placeholder="密码" />
  <input type="text" id="authNickname" placeholder="昵称（注册时需要）" style="display:none;" />
  <button class="auth-btn" id="authSubmitBtn">登 录</button>
  <div class="auth-toggle">
    没有账号？<span id="toggleAuth">立即注册</span>
  </div>
  <div class="auth-toggle" style="margin-top:8px;">
    <span id="skipLogin" style="color:#888;">跳过登录（游客模式）</span>
  </div>
</div>

<!-- 聊天页面 -->
<div id="chatPage" class="chat-container">
  <div class="chat-header">
    <img class="avatar-img" id="myAvatar" src="" alt="头像" />
    <div class="header-info">
      <h3 id="myNicknameDisplay">游客</h3>
      <small id="myUsernameDisplay"></small>
    </div>
    <div class="status-badge" id="connectionStatus">连接中...</div>
  </div>
  <div class="messages-box" id="messagesContainer"></div>
  <div class="input-area">
    <input type="text" id="messageInput" placeholder="输入消息..." />
    <button class="icon-btn image-btn" id="imageButton">🖼️</button>
    <button class="icon-btn voice-btn" id="voiceButton">🎤</button>
    <button class="icon-btn send-btn" id="sendButton">➤</button>
  </div>
  <input type="file" id="imageInput" accept="image/*" style="display:none;" />
  <input type="file" id="avatarImageInput" accept="image/*" style="display:none;" />
</div>

<!-- 头像选择弹窗 -->
<div class="avatar-modal" id="avatarModal">
  <div class="avatar-panel">
    <h3>选择头像</h3>
    <div class="avatar-options" id="avatarGrid"></div>
    <div class="btn-group">
      <button class="btn btn-primary" id="pickFromGallery">📷 从相册选择</button>
      <button class="btn btn-secondary" id="closeAvatarModal">关闭</button>
    </div>
  </div>
</div>

<script>
(function() {
  const authPage = document.getElementById('authPage');
  const chatPage = document.getElementById('chatPage');
  const authUsername = document.getElementById('authUsername');
  const authPassword = document.getElementById('authPassword');
  const authNickname = document.getElementById('authNickname');
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const toggleAuth = document.getElementById('toggleAuth');
  const skipLogin = document.getElementById('skipLogin');
  const myAvatar = document.getElementById('myAvatar');
  const myNicknameDisplay = document.getElementById('myNicknameDisplay');
  const myUsernameDisplay = document.getElementById('myUsernameDisplay');
  const connectionStatus = document.getElementById('connectionStatus');
  const messagesContainer = document.getElementById('messagesContainer');
  const messageInput = document.getElementById('messageInput');
  const imageInput = document.getElementById('imageInput');
  const avatarImageInput = document.getElementById('avatarImageInput');
  const avatarModal = document.getElementById('avatarModal');
  const avatarGrid = document.getElementById('avatarGrid');

  let isLoginMode = true;
  let currentUser = { username: null, nickname: '游客', avatar: '😀', avatarType: 'emoji' };
  let socket = null;
  let clientId = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  const avatarEmojis = ['😀','😎','🤖','👽','🐱','🦊','🐼','🐨','🦁','🐸','🐵','🦄'];

  // 生成头像显示
  function getAvatarDisplay(avatar, type) {
    if (type === 'image' && avatar && avatar.startsWith('data:image')) {
      return avatar;
    }
    // emoji 转 SVG
    return `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%234b7bec" width="100" height="100"/><text x="50" y="68" font-size="50" text-anchor="middle">${avatar || '😀'}</text></svg>`;
  }

  function updateMyAvatarDisplay() {
    myAvatar.src = getAvatarDisplay(currentUser.avatar, currentUser.avatarType);
  }

  function initAvatarGrid() {
    avatarGrid.innerHTML = '';
    // Emoji 选项
    avatarEmojis.forEach(emoji => {
      const div = document.createElement('div');
      div.className = 'avatar-option';
      div.textContent = emoji;
      if (currentUser.avatarType === 'emoji' && emoji === currentUser.avatar) {
        div.classList.add('selected');
      }
      div.onclick = () => {
        currentUser.avatar = emoji;
        currentUser.avatarType = 'emoji';
        updateMyAvatarDisplay();
        saveAvatarToServer();
        initAvatarGrid();
      };
      avatarGrid.appendChild(div);
    });
    // 如果有自定义图片头像，也显示
    if (currentUser.avatarType === 'image' && currentUser.avatar) {
      const imgDiv = document.createElement('div');
      imgDiv.className = 'avatar-option selected';
      const img = document.createElement('img');
      img.src = currentUser.avatar;
      imgDiv.appendChild(img);
      imgDiv.onclick = () => {
        currentUser.avatarType = 'image';
        updateMyAvatarDisplay();
        saveAvatarToServer();
        initAvatarGrid();
      };
      avatarGrid.appendChild(imgDiv);
    }
  }

  function saveAvatarToServer() {
    if (currentUser.username && socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({
        type: 'update-profile',
        avatar: currentUser.avatar,
        avatarType: currentUser.avatarType
      }));
    }
  }

  function showChatPage() {
    authPage.style.display = 'none';
    chatPage.style.display = 'flex';
    myNicknameDisplay.textContent = currentUser.nickname;
    myUsernameDisplay.textContent = currentUser.username || '游客模式';
    updateMyAvatarDisplay();
    initAvatarGrid();
  }

  function connectWebSocket() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}`;
    socket = new WebSocket(wsUrl);

    socket.onopen = () => {
      connectionStatus.textContent = '已连接';
      if (currentUser.username) {
        socket.send(JSON.stringify({ type: 'login', username: currentUser.username }));
      }
    };

    socket.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        handleMessage(data);
      } catch(e) {}
    };

    socket.onclose = () => {
      connectionStatus.textContent = '断开';
      setTimeout(connectWebSocket, 3000);
    };
  }

  function handleMessage(data) {
    switch(data.type) {
      case 'welcome':
        clientId = data.clientId;
        break;
      case 'login_success':
        currentUser.nickname = data.nickname;
        currentUser.avatar = data.avatar;
        currentUser.avatarType = data.avatarType || 'emoji';
        myNicknameDisplay.textContent = data.nickname;
        updateMyAvatarDisplay();
        initAvatarGrid();
        addSystemMsg('✅ 登录成功，欢迎回来！');
        break;
      case 'profile_updated':
        currentUser.nickname = data.nickname || currentUser.nickname;
        currentUser.avatar = data.avatar || currentUser.avatar;
        currentUser.avatarType = data.avatarType || currentUser.avatarType;
        updateMyAvatarDisplay();
        break;
      case 'message':
        addMessage(data);
        break;
      case 'system':
        addSystemMsg(data.text);
        break;
    }
  }

  function addMessage(data) {
    const isSelf = (data.clientId === clientId);
    const div = document.createElement('div');
    div.className = `message ${isSelf ? 'self' : 'other'}`;
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    
    if (data.imageUrl) {
      const img = document.createElement('img');
      img.src = data.imageUrl;
      bubble.appendChild(img);
    } else if (data.audioUrl) {
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = data.audioUrl;
      bubble.appendChild(audio);
    } else {
      bubble.textContent = data.text || '';
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const time = data.timestamp ? new Date(data.timestamp).toLocaleTimeString('zh-CN', {hour12:false}) : '';
    const senderAvatar = data.avatarType === 'image' && data.avatar ? 
      `<img class="small-avatar" src="${data.avatar}" />` :
      `<img class="small-avatar" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect fill='%234b7bec' width='20' height='20'/><text x='10' y='14' font-size='10' text-anchor='middle'>${data.avatar||'😀'}</text></svg>" />`;
    meta.innerHTML = `${senderAvatar} ${data.sender||'匿名'} · ${time}`;
    
    div.appendChild(bubble);
    div.appendChild(meta);
    messagesContainer.appendChild(div);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function addSystemMsg(text) {
    const div = document.createElement('div');
    div.className = 'system-message';
    div.textContent = text;
    messagesContainer.appendChild(div);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  // 登录/注册
  authSubmitBtn.addEventListener('click', () => {
    const username = authUsername.value.trim();
    const password = authPassword.value;
    if (!username || !password) return alert('请填写完整');

    const endpoint = isLoginMode ? '/api/login' : '/api/register';
    const body = { username, password };
    if (!isLoginMode) {
      body.nickname = authNickname.value.trim() || username;
      body.avatar = '😀';
    }

    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(r => r.json()).then(res => {
      if (res.success) {
        if (isLoginMode) {
          currentUser = {
            username,
            nickname: res.user.nickname,
            avatar: res.user.avatar,
            avatarType: res.user.avatarType || 'emoji'
          };
          showChatPage();
          connectWebSocket();
        } else {
          alert('注册成功，请登录');
          toggleAuthMode();
        }
      } else {
        alert(res.message);
      }
    }).catch(() => alert('网络错误'));
  });

  toggleAuth.addEventListener('click', toggleAuthMode);
  function toggleAuthMode() {
    isLoginMode = !isLoginMode;
    authSubmitBtn.textContent = isLoginMode ? '登 录' : '注 册';
    toggleAuth.textContent = isLoginMode ? '立即注册' : '已有账号？去登录';
    authNickname.style.display = isLoginMode ? 'none' : 'block';
  }

  skipLogin.addEventListener('click', () => {
    currentUser = { username: null, nickname: '游客' + Math.floor(Math.random()*1000), avatar: '😀', avatarType: 'emoji' };
    showChatPage();
    connectWebSocket();
  });

  // 头像弹窗
  myAvatar.addEventListener('click', () => {
    initAvatarGrid();
    avatarModal.classList.add('active');
  });
  document.getElementById('closeAvatarModal').addEventListener('click', () => {
    avatarModal.classList.remove('active');
  });
  avatarModal.addEventListener('click', (e) => {
    if (e.target === avatarModal) avatarModal.classList.remove('active');
  });

  // 从相册选择头像
  document.getElementById('pickFromGallery').addEventListener('click', () => {
    avatarImageInput.click();
  });

  avatarImageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    // 压缩图片
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSize = 200;
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxSize) { h *= maxSize / w; w = maxSize; } }
        else { if (h > maxSize) { w *= maxSize / h; h = maxSize; } }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL('image/jpeg', 0.7);
        
        currentUser.avatar = compressed;
        currentUser.avatarType = 'image';
        updateMyAvatarDisplay();
        saveAvatarToServer();
        initAvatarGrid();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
    avatarImageInput.value = '';
  });

  // 发送消息
  document.getElementById('sendButton').addEventListener('click', () => {
    const text = messageInput.value.trim();
    if (text && socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: 'message', text }));
      messageInput.value = '';
    }
  });

  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('sendButton').click();
  });

  // 图片消息
  document.getElementById('imageButton').addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onloadend = () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'image', image: reader.result.split(',')[1] }));
      }
    };
    reader.readAsDataURL(file);
    imageInput.value = '';
  });

  // 语音
  const voiceBtn = document.getElementById('voiceButton');
  async function startRecord() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, {type:'audio/webm'});
        const reader = new FileReader();
        reader.onloadend = () => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'audio', audio: reader.result.split(',')[1] }));
          }
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      voiceBtn.classList.add('recording');
    } catch(e) { alert('无法访问麦克风'); }
  }
  function stopRecord() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      voiceBtn.classList.remove('recording');
    }
  }
  voiceBtn.addEventListener('mousedown', startRecord);
  voiceBtn.addEventListener('mouseup', stopRecord);
  voiceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecord(); });
  voiceBtn.addEventListener('touchend', stopRecord);

})();
</script>
</body>
  </html>
